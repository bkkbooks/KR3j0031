body:
  text: 東觀餘論卷上宋黃伯思撰法帖刋誤叙淳化中內府既博訪古遺蹟時翰林侍書王著受詔緒正諸帖著雖號工草𨽻然初不深書學又昧古今故祕閣法帖十中璠珉雜糅論次乖訛世多耳觀遂久莫辨故禮部郎米芾元章筆翰妙薦紳間在淮南幕府日嘗跋尾作數百語頗有條流但槩舉其目疏略甚多故諸部中或僞蹟甚著而不覺者若李懷琳所作衛夫人書逸少闊别稍久帖之類有雖審其僞而譏評未當者若知伯英大令諸草帖為唐人書而不知乃書晉人帖語之類有譏評雖當主名昭然而不能辨者若以田疇字為非李斯書而不知乃李陽冰明州碑中字之類有誤著其主名者若以晉人章草諸葛亮傳中語遂以為亮書之類是也其餘舛午尚多書家責能書者備故僕於元章慨然古語有之善書不鑒善鑒不書僕自幼觀古帖至多雖豪墨積習未至而心悟神解時有所得故作法帖刋誤凡論真僞皆有據依使鍾王復生不易此評矣元章今已物故恨不示之後有高識賞豫知言大觀戊子嵗六月七日西都府院東齊序法帖刋誤上第一帝王書凡草書分波磔者名章草非此者但謂之草猶古𨽻之生今正書故章草當在草書先然本無章名因漢建初中杜操伯度善此書章帝稱之故後世目焉今此卷首帖偶章草便以為章帝書誤矣然此書亦前代作但録書者集成千字中語耳米徑以此辨之未中其病米云晉武書當是孝武非也僕案省啓帖與後譙王帖雖在疑録似非一家書續帖中炎報帖頗與此筆法同炎晉武名非孝武也然皆後人依放此帖末云故遣信還古者謂使為信故逸少帖云信遂不取答真誥云公至山下又遣一信見告謝宣城傳云荆州信去倚待陶隱居帖云明旦信還仍過取反凡言信者皆謂使人也近世猶有此語故虞永興帖云事己信人口具而今之流俗遂以遣書饋物為信故謂之書信而謂前人之語亦然不復知魏晉以還所謂信者乃使之别名耳阿史病轉差帖云晉宣帝亦未然安軍破缸數朝三草書筆勢糾繞若一其僞不疑僕幼時嘗觀世傳七賢書末有白字皆連名作㸃七人所作了無小異雖當時筆法傳授或同然人書不同亦如面焉不應乃爾無别固疑其僞是時宿輩長者或謂不然後觀竇臮書賦始知七賢帖果李懷琳僞作此三帝草書亦是類也米云梁高當是齊高非也此帖末云蕭衍正梁武名梁武廟號高祖此書目誤以祖為帝耳宋明帝帖云報休祐休範二家內人知祐晉平王也範桂陽王也宋史以休祐為休祐蓋冊牘轉寫之訛當以祐為是弔江叔帖非唐文皇書案高宗永隆元年七月丙申江王元祥薨即此帖所謂江叔也高宗多以國呼諸父如滕叔不須賜謂滕王元嬰猶以元祥為江叔此正高宗書也叔藝韞多材帖亦高宗書中云聊以示藹謂魯王靈夔之子范陽王藹也靈夔亦高宗叔史稱其篤學善草𨽻此帖所謂叔藝藴多材慈深善誨藹夙奉趨庭之訓早擅臨池之工者以此後有答進枇杷并移營五橋南二帖皆高宗書此數段竝誤入太宗帖中陳文帝謂宣帝我名子以伯汝宜以叔此陳永陽王伯智書誤録在長沙王叔懷後又据陳史長沙王但有叔堅而無叔懷其晜亦無此名觀帖尾作名處疑是叔愼叔愼陳嶽陽王也蓋摹傳之變第二漢魏吳晉人書唐文皇右軍傳贊云伯英臨池之妙無復餘蹤當是時逺購冥搜古帖畢出而御府所蓄其富無倫尚無伯英書後世豈可復得非特唐也晉世見者亦寡故庾翼與右軍書云昔得伯英章草十紙過江亡失常歎妙蹟永絶此卷章草芝白一帖差近古亦疑先賢摹放也前知汝殊愁以下五帖米云皆張長史書信然但帖中有云數往虎丘祖希時面祖希張𤣥之字也𤣥之與大令同時虎丘地在江左當是長史書二王帖辭耳崔子玉書云數附書知聞以解其憂唐人書也字亦非漢尚書宣示鍾書真蹟本在王丞相導家導過江時藏衣帶中以遺逸少逸少以遺王修修死其母以修平日所寶并入棺真蹟遂絶此本右軍所臨者白騎遂帖乃王大令臨唐開元中在滑臺人家并逸少臨宣示帖藏之故誤録在鍾部長風帖乃逸少早年書殊未變鍾體故亦誤置此長風范母子等語二王帖間多有米云齊梁人書非也皇象文武帖蓋寫漢東觀校書郎中高彪送幽州督軍御史弟五永針耳結字亦古史本云吕尚七十此云師尚七十史本云明其果毅此云昭其果毅蓋作史者避晉諱當以此為是五將三門下當云地有九變丘陵山川人有計策六竒五間總兹三事謀則咨詢無曰已能務在求賢淮隂之勇廣野是尊勿謂時險不正其身勿謂無人莫識已真忘富遺貴福祿乃存枉道依合後無所觀先公高節永越可遵佩藏斯戒以厲終身時蔡雍輩竝賦詩送永獨彪作此針雍等甚美之以為莫尚也全章見東漢書此假軼之象書人間殊少惟建業有吳時天發神讖碑若篆若隸字勢雄偉相傳乃象書也張懷瓘目以沈著痛快真得其筆勢云皇象後章草一表蓋唐人僞作其體正與世傳曹植書鷂雀賦同皆非真蹟至若孫皓上晉武表亦章草書字畫高古與此有間矣王小令此年帖本唐人所畜與二鍾虞松三帖為一珉帖末云輔國司馬君筆勢婉雅與此有間矣此亦無後五字謝安後一帖傳摹逺真米以為僞者蓋以惶恐再拜當時罕用然施於尊老或有之陶華陽真誥中有帖云許𤣥惶恐再拜正晉世體也王世將二十四帖與第一㢧數朝等僞帖字勢無異惟後兩表極古信能傳鍾氏筆意而右軍學之也表中有云頓乏勿勿按顔氏家訓云世中書翰多稱勿勿相承如此莫原其由或有妄言此忽忽之殘闕耳說文勿者州里所建之旗蓋以趨民事故匆遽者稱勿勿僕謂顔氏以說文證此字為長而今世流俗又妄於勿勿字中斜益一㸃讀為匆字彌失真矣按祭義云勿勿諸其欲其饗之也注勿勿猶勉勉也慤愛之貌杜牧之詩浮生長勿勿是知勿勿出於祭義唐人詩中用之不特稱於書翰耳第三晉宋齊人書庾亮書云奉告書箱先為媞子作案江淮之間謂母曰媞此云媞子未知目何戚也爾匹云媞媞安也庾翼帖稱故吏從事中郎按翼嘗為陶侃太尉府從事中郎此當是與侃啓也杜預十一月二十四日帖云道逺書問又簡間得來况非當時尺牘中語或是江左人書不特親故帖僞也親故末云數附書信以慰吾心亦近世流俗語耳晉劉超為人愼密自以書類元帝不敢與外書此帖不應尚傳又字勢與元帝大别其僞甚矣謝莊首終仕宋而題曰晉大誤王著叙王坦之書列於逸少諸子間意以名皆從之殊不知坦之乃述子自太原王耳非琅邪族也非通古甚那至爾川本去此七字意非字下有不字劉瓌之乃東晉時善八分者大令既不肯書太極殿榜謝安石遂令瓌之以八分題之今此草帖非真與王廙二十四日帖無異王氏凝操徽渙之四子書皆真帖逸少七子上四人與子敬書具傳惟𤣥之肅之遺蹟未見餘皆得家範而體各不同是善學逸少書者猶顔延年對宋文帝論其諸子自謂竣得臣筆測得臣文㚟得臣義躍得臣酒書亦猶是也僕今以擬王氏諸子則逸少之書凝之得其韻操之得其體徽之得其勢渙之得其貌獻之得其源然而大令之書特知名而與逸少方駕者蓋能本父之書意所循者大故也真行則法鍾草聖則師張二家之法逸少所自出從而效之所以特高於諸王猶魯堂諸子由賜商偃皆以儒稱卒之得其傳者子淵而已索靖七月二十六日帖本七紙晉王平南廙每寶玩之值永嘉亂乃四疊綴衣中以度江唐蒲州桑泉令豆盧器得之疊迹猶存今所録惟一紙耳摹傳失真無復意象紀瞻帖中有云貧家無以將意所謂物微意全也觀此語不待見筆蹟可判其僞矣山濤啓事與李懷琳所撰七賢書中濤書自相戈盾但此啓事文是而書非七賢帖中筆語皆妄也此卷僞帖甚衆如庾翼後一帖與沈嘉王循司馬攸劉穆之王劭王廞張翼陸雲羊欣卞壼謝發與前杜預一帖及劉超劉瓌之紀瞻山濤等帖皆一體僞作孔琳之帖有恨恨腳中轉劇近明散未覺益十二字偏小蓋行側注字摹帖者妄以入行耳當依本為勝王僧䖍兩啓皆佳結字與擬王琰乞江郢所統郡啓同書聲信不虛得第四梁陳唐人書齊豫章王嶷孫確子範之子在梁位司徒右長史此云征南將軍不知何據恐是梁邵陵王綸之子確也其書孝經一章亦近世僞體非江左書阮研帖亦然蕭子雲有章草史孝山出師頌一章甚古雅與此卷正書列子逺矣紙中王濛筆下徐偃信篤論也陳逵者晉西中郎將也此云陳朝陳逵書誤矣禇河南潭府帖末云舅遂良報薛八侍中前外舅張知常以為河南謫潭時無有薛姓為侍中者僕嘗考之信然按遂良以高宗永徽六年貶潭州都督前此上至神堯時為侍中者裴矩齊王元吉杜如晦王圭魏元成楊師道劉洎張行成高季輔宇文節韓瑗凡十一人未有薛姓者至儀鳳中薛元超始作相既在遂良後又不作侍中當時在外鎮未有兼此官者及觀字勢亦斆禇作嫵媚態其僞必矣後家姪至一帖乃真河南得意書翩翩有逸敬體以前帖視之猶蓬葭倚瑶林也山河帖乃禇河南所書枯樹賦中鈔出耳此庾子山作而禇書之後禇遂良述四字後人妄益虞永興大運帖歐陽率更比年帖皆集二公碑中字為之柳少師與弟帖末云誠懸呈人多疑之以顔籀注漢書丞相衡傳云字以表德豈人所自稱柳不當稱字然嘗觀逸少敬謝帖自云王逸少白廬山逺公集盧循與逺書自云范陽盧子先叩頭則古人稱字蓋或有之陸柬之帖云近得告為慰上下無恙不得吳興近問懸心得藥書散勢耿耿嘗也殊不類唐人語當是臨晉宋人帖不爾效其語作此耳薄紹之宋世為丹陽尹書與羊欣齊名時號羊薄此卷目為唐人謬甚矣第五雜帖自蒼頡至程邈書皆僞史籀書傳此者岐鼓耳今此書云揚州裴易德系字殊無三代體與其辭皆唐人筆也李斯書米云不知何人書僕按其文云田疇耕耨為政期月而致法令使父子為鄒魯乃李陽冰篆王密所撰明州刺史河東裴公紀德碣中字也其碑略云驚逋復田疇闢教以耕耨故為政可期月而致寬之則法令非行公之化夷俗為鄒魯使父子長幼各得其宜此帖乃摹田疇等十八字為斯書與碑中篆無銖黍差而米云不知何人書蓋未嘗見此碑耳程邈在秦雲陽獄作隸字乃今漢碑中字是也有此隸方生今正書不應邈巳作之宋儋唐明皇帝時人學鍾書但作側戾殊失大勢王著録此書不知乃唐士意為逺古人故與斯邈並列其誤至此儋有嵩山圭禪師等碑傳於世字亦不甚工衛夫人帖蓋唐初李懷琳作事見竇臮述書賦如續帖中嵇康絶交書世傳七賢帖皆懷琳僞蹟也此與師帖尤疏謬按梁蕭子雲答武帝敕云臣昔不能拔賞隨時所貴規模子敬多歷年所年二十六著晉史至二王列傳欲作論草隸法言不盡意遂不能成十許年始見敕㫖論書一卷商略筆狀洞徹字體始變子敬全範元常逮爾巳來自覺功進此僞帖云但衛隨世所學規摹鍾繇遂歷多載年二十著詩論草隸又云筆勢洞精字體遒媚皆竊取子雲啓中語欲小改之遂失其句讀今世高識豈無何不悟此又衛夫人乃晉李距妻李充母名鑠字茂猗既與師書自當著名不但稱夫族及姓也以數事考之其僞不疑又前輩論此帖以其敇字從力館從舍為僞未中其病蓋自二王以來訛字甚多陳為陳策為策皆二王輩自製不可據此定真僞也隋詔書中敬字缺其波蓋淳化中摹此書時特省去避諱耳或指此目為僞帖非也梁武帝書評乃命袁昂作者其答啓云奉敕遣臣評古今書臣愚短豈敢輒量江海但天㫖諉臣斟酌是非謹品字法如前此云梁武評書誤矣袁昂不以書名而評裁諸家曲盡筆勢然論者以其評張芝書云如漢武愛道憑虛欲仙則欲仙而已至况薄紹之書乃云如仙人嘯樹則真仙也為比擬失倫此亦一病也寫此者字法局束天然太少疑非智果書果號得右軍骨借譽浮其實亦不至爾何氏書若云何人耳或以為何姓非也米以二帖為歐陽率更書良是敬祖鄱陽二帖大令部中已有此重出耳敬祖王導子武岡侯協也與大令不同時恐非其書孤不度德量力與亮白董卓以來二帖皆諸葛傳中與昭烈問答語有一假自孫權據有江東以下與此文相接誤置第十卷王大令部中皆章草書雖字畫大小微異而筆勢若一大是全寫亮傳首語此文雖出亮言亦史家潤色之又中云亮曰亦史家所記米遂謂亮書差千里矣僕謂此帖當是逸少書蓋與此公章草豹奴帖筆法同移屋有意適閒曠二帖真羊中散書與唐薛雍家所蓄筆精帖字勢同與法帖本部中三月六日帖殊不類彼六日帖乃僞也筆精帖真羊公得意書或以為逸少則過矣法帖刋誤下第六王㑹稽書上自適得書至慰馳疏或作竦耳中間諸帖除穆松及秋中二帖差似逸少書餘並近世不工書者僞作耳非特筆無晉韻又宅上靜眠過此如命等乃今流俗語不待觀筆蹟已可辨之酸感至比加一作和下及宰相并噉豆鼠伏想㛐等亦僞作蓋以逸少别帖埀三十年比加下㿃等語厠其間或云宰相安和帖乃郗愔書謂宰相者簡文作相王時也殷生者殷浩也然此或是書郗愔帖語耳而結字實近世人僞作愔書自與逸少早年抗衡而此帖了無晉韻其非審矣鯉魚帖敬字行成帖殷字皆缺語在第五章夫人及蔡家二帖亦後人依放賈曾送張說赴朔方序中云備官而行成旅比從下云有詔具寮爰開祖宴且申後命寵以蕃錫此卷有此文自行字上祖字下皆亡之而作草書多不綴屬當是集逸少書寫此序耳先輩以為張說送賈至文非也米亦以自是月下為僞殊不知自行成下已僞蓋此帖失其首尾而米未嘗考賈㑹文也闊别稍久眷與時長帖末云遇信匆遽萬不一陳字既甚惡而筆語乃爾非逸少書無疑吾昨得一日一起帖米以為張長史書有之但米論書多以草字差大者為非二王書一概求之理恐未竟追尋帖米以為大令書非也字勢圜緊既非獻之體而中云吾老矣餘願未盡惟在子輩耳案大令夀四十三初無後嗣與此不合又法書要録逸少帖內有此語固宜在此卷二十日以下二帖結體雖疏詞筆皆有王氏風氣殆是唐人縱筆臨放非摹􅒽也不得臨川問帖亦非逸少書庾子嵩非同時人也朱處仁帖在十七帖間其中有云往得其書信遂不取答謂昔嘗得其書而信人竟不取報書耳而世俗遂誤讀為往得其書信殊不知信者乃使人也自連下語非若今之所謂書信也第一篇晉武帖中已詳辨之第七王㑹稽書中得都下九日帖中云蔡公者蔡謨也仁祖者謝尚也晉穆帝永和十二年秋桓公破姚襄至洛故此云久當至洛是時將以謝尚鎮司州以病止故此云得仁祖二十六日問疾更委篤與陶榖家所畜逸少破羌帖中所書事正同其帖云知虞帥云桓公以至洛即摧破羌賊賊重命想必禽之王略始及舊都使人悲慨深此公威略實著自當求之於古真可以戰使人歎息知仁祖小差此慰可言適范生書如其語無異故須後問為定今以書示君僕嘗跋之云晉穆帝永和十二年秋桓溫破姚襄於伊水遂至洛時將以謝尚鎮之屬病不行所云桓公摧破羌賊及仁祖小差正當時事也是時逸少去㑹稽內史巳嵗餘方遁迹山水間宜不復以世務經懷而此書乃歎宣武之威略悲舊都之始平憂國嗟時志猶不息惜其一憤逺引使才猷約結弗光於世獨區區遺翰見寶後人覽之深為興歎此帖草法極工惜不載法帖間故附見此條與足下意政同政當作正蓋逸少祖尚書郎名正故王氏作書正月或作初月或作一月他正字皆以政代之後人相承斆之非也自初月二日至前從洛帖皆僞如初月有云羲之呈耳願知心素致使如然也願足下莫見責乃俗人僞作弟恐是著書觀其所補永禪師千字格韻與此正同十月七日帖米以為集成豫謂昨見君帖亦然蓋二帖字意皆不相屬而十月帖頗取十七帖中足慰前可令必達以副此志逺想慨然等帖中語厠其間如云足下尚停數日得告承長平未佳足下大小佳也知比得丹陽書熱日更甚期已至旦反想至七帖皆後人依放中有云不易可得過夏知有患者早乘凉行皆非當時人語承足下還來一帖不論可見其僞荀侯帖云安好音信明公還得歸洛也詞筆皆如初月帖劉次莊釋云安好音信那可遇得歸洛也深以自慰晚復毒熱二帖唐文皇所臨者羲之白耳帖不論可見其僞僕近修小園子殊佳帖米以為子敬書僕謂處動靜以下方是子敬筆前兩行乃唐人書字勢帖語與後迥殊第八王㑹稽書下羲之死罪小大悉佳帖書殊惡末云因緣不多亦近代所為耳足下各如常亦唐人作比初月帖差勝中云淡悶干嘔淡古淡液之淡干古干溼之干今人以淡作痰以干作乾非也據此當亦非今人所作闊轉久帖末云卒未近緣如何非晉士語阮公故爾一帖非逸少書蒸溼帖米云大令代父書非也蓋結字殊不同詞亦異晉體修齡王胡之也重熙郗曇也安西庾翼也其云一昨得安西六日書無他無所知說故不復付送讓都督表亦復常言耳按翼之鎮荆州以石虎衰暴婁表請北伐康帝及朝士皆遣使譬止孫綽輩亦致書諫之則逸少所見之表殆亦論北伐事也翼之此舉朝論弗以為然故逸少以為常言及聞其遷襄陽乃云稚恭遂進鎮東西齊舉想尅定有期也則始雖同羣議而終以為當猶趙充國之計罕羌初是之者十三中十五最後十八有詔詰前言不便者皆頓首服無足怪也然翼有志無年徒奮十倍之氣而蔑一統之功此志士所嗟慨者逸少所書進鎮帖唐張彥逺載於書録今聞在王仲修家月半帖雖晉人語字不合作蓋後人寫二王尺牘中語耳此郡帖米謂與王述書非也逸少與藍田方隙而為屬郡既檢察苛急主者疲於課對正救過不暇豈復尺牘間自彰其逋滯哉此帖官本傳摹甚失真如以就勞為能勞小却為小都皆轉失草法也適欲遣書帖非逸少書逸少十七帖本唐貞觀御府中書張彥逺云王草書中烜赫著名帖也僕謂當時書卷首帖有十七日字故諸帖總謂之十七耳非帖數也本二十七條今官法帖有其十五散置逸少書三卷中又續法帖有五而卭竹杖絲布衣漢講堂諸葛顒天鼠膏四果種虞安吉七條不載當是亡軼而世有完卷者傳摹殊精非此比也此卷有帖云周益州送此卭竹杖卿尊長或須今送僕按十七帖有云去夏足下致卭竹杖皆至此士人多有尊老者皆即分布令知足下逺惠之至以前帖觀之即知此帖蓋與周益州矣自昔相傳十七帖乃逸少與蜀太守者未必盡然然其中問蜀事為多是亦應皆與周益州書也但來禽一帖則或以為與桓溫而已本朝僧邦者有寄李昌武翰林詩云來禽簡寄桓宣武不知何據按此帖有云今在田里惟以此為事足下致此子者大惠也逸少視桓公位殊遼絶與書不當爾耳然當時真長子猷輩猶嫚侮桓公彼亦能容逸少作書若交友蓋無足怪溫飛卿詩云畫圖驚畏獸書帖得來禽此帖垂寶非一世也第九王大令書上此卷王大令部僞者最少相過無復日借匪獻之韻自可賞鵝還慰姊意帖鵝者王氏子姓之小字耳猶袁羊顧虎之類或以此鵝即逸少所愛之鵝甚可鄙笑二十九日帖云昨遂不奉恨深此近世人語非子敬書靜息帖云賴消息內外極生冷內外二字本行旁注故字差小而昧者摹填著行中非也當依本為勝諸帖中此例甚多如十七帖中逺想慨然孔琳之帖恨恨腳中轉劇等字本皆側注後人摹以入行雖失格體猶於理未害至於讀蘭亭叙者以不知老之將至旁一僧字為逸少作曾字之誤借使摹入行中則害理矣案古蘭亭叙本二十八行至第十四行間特闊者蓋接紙處而不與知字適在此行之末梁舍人徐僧權於其旁著名當時謂之押縫梁御府中法書率如此而此帖僧字下亡其權字近世人殊不知此乃云僧者曾之誤因讀為曾不知老之將至非也又案晉史逸少本傳及書録第十卷皆載此叙但云不知老之將至而無曾字益可是正乃知善摹帖者勿問其黵滅注缺橫斜細大一放其本而不小異乃不失真矣今法帖多妄更易之至以注字入行大小既殊體不綴屬後人不曉從而效之一行之中洪纎頓異號子母體如第五卷近世僞作釋智果書是也每一觀之使人深慨靜息帖云礜石深是可疑事兄喜患散輒發癰散者寒食散之類散中蓋用礜石是性極熱有毒故云深可疑也劉表在荆州與王粲登障山見一岡不生百草粲曰此必古冢其人在世服生礜石熱蒸出外故草木焦滅鑿看果墓礜石滿塋又今洛水冬月不冰古人謂之溫洛下亦有礜石今取此石置瓮水中水亦不冰又鸛伏卵以助暖氣其烈酷如此固不宜餌服子敬之語實然聊附於此授衣帖歷世所傳自為一卷法帖中亡其帖尾政在此耳下當云當今可復使不萬全不願其以多算難易得之便自可令不為因絫耳比者忉怛當不可言當不可言獻之死罪法帖無此四十三字義其間多有燥筆及魚食處而官帖不復依本其失多矣奉對帖云方欲與姊極當年之足以之偕老豈謂乖反至此當是與郗家帖也案子敬病篤請道士上章法應首過子敬曰不憶餘事惟省與郗家離㛰子敬前室郗曇女也郗氏自太尉鑒後為江左名族其姓讀如絺繡之絺而世人以俗書郗字作郤因讀為卻詵之卻非也卻詵乃春秋晉大夫卻縠郗鑒乃漢御史大夫郗慮之後姓原既異音讀迥殊後世因俗書相亂郗卻二姓遂不復辨亦近代氏族及小學二家之學不講故也陸魯望博古矣其詩有云一假清香染郤郎亦誤讀也今因郗氏帖聊爾及之以糾俗繆梁中書郎虞和表云逸少為㑹稽子敬為吳興故三吳之地偏多遺蹟又是暮年遒美之時今此卷中亦時有吳興帖然大令帖傳於世佳者尚多如乞假表庾公帖周姊帖洛神賦劉氏所藏十二字等帖官帖中皆遺之僕頃以韻語題河南王氏所藏子敬帖云君家大令書盈紙筆勢翩翩趣多媚雖云沓拖如少年豈至拘攣同餓𨽻㑹稽七子五知名此公風槩尤超詣太極璇題猶重書謂不書太極殿榜一時凛凛標英氣半䄂精祴衆爭求數幅新裙世尤貴當時親遇得已難况復傳今僅千嵗龍珠歸浦劍還津此帖君藏真得地才披尺許目增明鸞跂鴻驚欲飛逝硬黃響榻若傳吾完碧摹刋願垂世聊爾以記大令書事漫附於此𤣥度時來一帖米以為無名人作僕謂此真晉人語但筆勢疏緩多失落耳謂大令書則非蓋中云仁祖欲請為軍司案獻之以晉孝武太元十一年年四十三卒上推謝尚於穆帝升平元年卒時獻之方年十三請軍司又在升平前大令是時才十許嵗安得巳作書論時事殆是穆帝時他人書後𤣥度何來遲亦此類薄泠益部二帖米以為歐率更書實然但米誤以益部字為益郎蓋下接耆舊傳字此帖蓋借陳夀所著益部耆舊傳也詠史詩鬱鬱澗底松數句乃集大令書一月二十九日黃門帖亦王氏書而非大令也第十王大令書下吾當託桓江州助汝帖米以為張長史書雖未必然要非大令書也案此帖不至惡但縱任近俗無晉世清韻真非大令書但殊不知亦寫右軍帖詞耳張彥逺右軍帖録有此語此卷亡其半其上略云汝決欲來下張録於來下之字下有三十九字續帖略同上方大枋想汝不過數枋足人方足張録云人力當粗足不果爾可白吾當託桓江州助汝續帖逸少部中有前假結字殊應規矩蓋王氏子弟臨逸少書勝此逺矣疾不退至分張帖諸大草字語類江表人𤣥度何來亦似逸少語其字皆張長史藏真輩僞作或自書二王帖語耳與第二卷知汝殊愁及藏真長史部中諸帖一手也豹奴桓嗣也王氏甥故二王帖中時及之如云豹奴晚歸家之類然此豹奴惟省一書帖亦後人依放極熱敬惟府君帖云來時幾得問希此消息極悶悶又云意甚無賴君有好藥云云極濟事耶又服油帖云不至絶艱辛也皆近世俗言字勢亦不至佳非王氏帖明甚帖云意甚無賴君有好藥必時復與府中多少極濟事耶七月二日獻之白七字人僞作也下章草云孫權據有江東以歷三世亦蜀志中語與第五卷章草不可爭鋒也語相接字雖大小異乃一人書語已見本章此段世字闕中畫蓋唐人臨摹時去之以避諱猶今集法帖時殷敬二字多省其波也但東連吳㑹與用武之國連武二字章草體差相亂摹者謬互置之復而悲積宋齊人書㛐等帖王氏書亦非大令鵝羣帖前輩謂此墨帖乃大令真筆僕觀此書殊不惡但怒張狂徑無晉諸賢韻味而前輩乃云此帖筆勢險逺如從空中數丈外擲下恐是真筆此非僕之所敢知也又此帖詞云崇虛劉道士鵝羣並復歸也獻之等須向彼謝之亦非當時尺牘體蓋以大令父逸少嘗書道德經換鵝而山隂曇􅙓村道士舉羣贈之故以此事傅㑹作是帖耳案崇虛館乃宋明帝泰始四年建子敬晉人相去亡慮五十餘年何得已稱之其僞可無疑又按魏收釋老志太和十五年詔立道家寺宇於桑乾之隂名崇虛寺去晉愈逺矣豫前所校量諸書詎敢自謂竟理要非臆決目論蓋書雖小道亦六藝之一能之既艱知亦匪易然天下理當為天下士言之真賞難遇豈獨論書哉長睿頃官于洛因得從之游嘗閲吾家所藏內府帖且以米老跋尾辨之惜其疏略遂著此書議論精確悉有證據使真贋了然誠前人所未到也是書之作實自余發之嘗作詩題吾家大令帖見於第九章云政和甲午正月十三日周南王玠晉玉題於開封尹㕔之東齊川本無余待罪天祿與觀中祕古蹟石刻所本其真易識蓋了然知其僞者十九而後乃知黃子之作此書拔賞者寡而掊擊者多故有以也書之考引載籍則昭昭矣至其洞察真贋品藻高下水墨之間毫釐千里則非書家者流心知其意未易不惑余是以道余所見於天祿者使世知其論刺之嚴如此皆不妄也政和五年三月中浣襄陵許翰嵩老跋川本無米元章跋祕閣法帖唐太宗購王逸少書使魏徴禇遂良定真僞我太宗購古今書而使王著辨精粗定為法帖此十卷是也其間一手僞帖大半甚者以千字文為漢章帝張旭為王子敬以俗人學智永為逸少如其閒以子敬及真智永為逸少者猶不失為名帖余嘗於檢校太師李瑋第觀侍中王貽永所收晉帖一卷內武帝王戎謝安陸雲輩法若篆籀體若飛動著皆委而弗録獨取郗愔兩行入十卷中使人慨歎又劉孝孫處見柳公權所收跋子敬送梨帖然於太宗卷中辨出乃以逸少一帖連在後而云又一帖不知為逸少也公權唐名家尚如此顧何議著今長安李氏所收逸少帖貞觀所收第一帖著名已非逸少真蹟餘可知矣獨未知徐璹徐浩子能别書所訪者何如耳余抱疾端憂養目文藝思而得之粗分真僞因跋逐卷末以貽好事同志百年之後必有擊節賞我者余無富貴願獨好古人筆札每滌一硯展一軸不知疾靁之在旁而味可忘嘗思陶𢎞景願為主書令史大是高致一念不除行年四十恐死為蠧書魚入金題玉躞間游而不害元祐三年維揚倦游閣襄陽漫士米芾元章書第一漢章晉元晉武齊高梁武梁高簡文右七帖並一人手寫僞帖晉武當是孝武梁高當是齊高第二張芝後一帖是前五帖並張旭崔子玉鍾繇長風齊梁人書皇象後臣象言同章帝一手僞帖王廙二十四帖同上謝安前一帖是後六月帖同上第三庾翼已向帖杜預親故帖王循司馬王劭劉瓌之劉穆之王廞張翼陸雲山濤卞壼謝發羊欣右皆與漢章一手僞帖第四阮研蕭確並同章帝虞世南臨樂毅論者俗人僞帖餘皆真歐陽詢比年亦俗人僞作第五李斯書未知何人書程邈與章帝一手蔡琰同上何氏二帖歐陽詢敬祖鄱陽二並子敬孤不度德亮白二並諸葛書懷素同程邈既移屋足下並羊欣末有欣白字第六適得書知欲差涼比奉對兄靈伏想㛐宰相安和又不能疾不退夫人想大小知足下連不快智永小佳是月也吾昨得張旭追尋子敬疾患二十餘日可耳劉釋文餘作僕定登劉釋文作定聽右不注出者皆僞第七初月二日足下時事吾怪足下前從洛十月七日集成當力承足下子敬荀侯足下家極知僕近修小園右不注出者皆僞第八此蒸溼子敬代父月半同上尊夫人僞適欲遣書智果第九相過終無復日𤣥度時往來前告先以陳慕容並無名人僞帖薄泠益郎並歐書第十吾當託桓江州消息疾不退省前書近與鐵石知鐵石𤣥度何來遲忽動大唐左衛長史張旭書承冠軍故爾復面悲積還此得西問海監諸舍並未詳何人書獻之白不審疾鄱陽歸右並羊欣第八此郡之弊蘇大簡子耆謂之與王述書及一昨得安西及增慨三帖真蹟自蘇氏歸吾家記與劉無言論書劉憲御史燾無言來豫與論書劉因言政和初人於陜西發地得木竹簡一瓮皆漢世討羌戎馳檄文書若今吏案行遣皆章草書然斷續不綴屬惟鄧隲永初二年六月一篇成文爾見前篇今宗室仲忽及梁師成家尚多得之石本乃就簡上摹得者豫因言見漢魏間人章表亦多用章草書今猶有存者如司馬孚孫皓表奏世或傳之疑所謂章草上章用之不因漢章帝好之因謂之章草也蓋此雖草書而有波磔若正書之有分隸既不顚放易曉又可赴急宜漢人以作檄書也劉言續帖中李懷琳所書絶交書多有古字若等字宜有所受非懷琳自能作也豫云張彥逺言昔嵇叔夜自書絶交書數紙人以右軍數帖來易惜不與之則叔夜書唐世尚有之疑懷琳嘗見之故放焉決非自能作也蓋懷琳嘗僞作衛夫人及七賢帖不逮此逺矣故竇臮云乃有懷琳厥蹟踈壯假他人之姓字作自己之形狀則知絶交書誠有所放也其卷尾云右軍書蓋誤云今世有蕭子雲章草書出師頌甚古雅與子雲他書全不類疑亦放漢人書也蓋東漢人喜作分隸與章草他書傳世者鮮矣豫言淳化法帖中有南唐人一手僞帖頗多如僞作山濤崔子玉謝發卞壼皆是一手寫古人帖語耳第三卷最多今祕閣有數匣尚存皆澄心堂紙書分明題曰倣書不作傳摹與真蹟而當時侍書王著編彚殊不曉特取名以入録故與真蹟混淆却多有好帖不入殊可惜也豫法帖正誤中論之甚詳劉言鄧隲簡書永初二年六月丁未朔二十日丙寅而東漢紀是年七月復有丙寅恐史誤也簡書當時文字又有月朔不應差云又云歐陽詢舉世呼為率更傳亦書其終於率更而有八分書一碑乃銀青光祿大夫為給事中史未嘗書也豫云此例甚多如唐史王方慶傳云自褒至方慶五世封石泉而今寶章集中方慶官云琅琊縣開國子則是方慶嘗封琅琊後徙石泉也亦史誤云至於世之稱謂則不常如楊凝式終太子太傅而今人但呼為楊少師之類劉云楊書賽過珊瑚樹一帖乃在洛中一僧房中於書㨭上寫之即俗所謂書襻者豫云洛陽文潞公家有楊書詩帖十一紙字與珊瑚帖相類今洛亦有石本而不能盡載也楊多書僧壁而傳於楮素者甚少今壁書亦自少洛陽惟有廣愛寺西禪院兩壁勝果院一壁天宫寺一壁而巳因甲子嵗大水損失者多矣劉言瀛州有邢巒碑甚完金陵有唐高正臣書本埋沒圃中其父宜翁令人發出立之今易致其字畫殊有虞禇法也又云續帖中春朝微雨一帖乃陸柬之書余云法帖中有柬之一帖乃晉人語恐柬之臨學者豫又云裴行儉以書知名而世人罕傳之嘗見一帖寫兵法字甚怪放恐非真也劉云嘗見行儉所書千字亦工云又云寶章集題者小字乃鍾紹京書豫云紹京碑今有存者蓋師薛稷也豫又云焦山鶴銘俗傳王逸少書非也一小書中載云陶隱居書此或近之然此山有唐王瓚一詩刻字畫全類此銘不知即瓚書抑瓚學銘中字而書此詩也劉曰嘗親至彼觀疑即瓚書也下有云皇山樵人逸少書非王逸少也蓋唐有此人亦號逸少耳又云作鍾鼎須用竹筆書乃佳豫云不然今鍾鼎字若季㜏鼎伯戔盫字皆兩頭纖纖若使竹筆何能如此劉又言頃謁蘇子容丞相未出閒見傳唐人一書中云文皇令羣臣上奏任用真草惟名不得草後人遂以草名為花押韋陟五朵雲是也此書偶忘其名有朝士施結者喜收古今人押字不逺千里求之所藏甚多類而成書矣嘗欲為作序偶忘此事所出遂不用豫云魏晉以來法書至梁御府藏之皆是朱异唐懷充沈熾文姚懷珍等題名於首尾紙縫間故或謂之押縫或謂之押尾秖是謂書名耳後人花押乃以草書記其自書故謂之押字或謂草字蓋沿習此耳唐人及國初前輩與人書牘或只用押字與名用之無異上表章亦或爾近世遂施押字於檄移或不書己名字而别作形模非也米元章禮部所作法帖題跋一卷真蹟藏西洛王晉玉家經靖康之亂已散亡矣先君學士法帖刋誤盛行於世博訪米氏題跋藏書家俱未之見偶檢故書忽見先君子親寫米氏題跋得之喜甚草書間有難解者取法帖逐卷中語釋出斯文遂成全書乃命筆史抄録附刋誤之後紹興癸亥冬十一月二十二日武陽黃䚮識記石經與今文不同臨漢石經與今文不同者殊多今略記之書女母翕侮成人今本女無侮老成人保后胥高保后胥戚女永勸憂汝誕勸憂女有近則在乃心今近作戕女比猶念以相從今作汝分猷各翕中各設中爾惠朕曷祗動萬民以遷爾謂朕曷震動天既付命今付作孚曰陳其五行今汨陳嚴恭寅畏天命自亮以民祗懼今亮作度以作治懷保小人惠于矜寡今人作民于作鮮母兄曰無皇曰則兄自敬德兄作皇旦以前人之微言今作徽言是罔顯哉厥世今哉作在文王之鮮光今作耿光通殷就大命達殷作大命論語意與之與今意作抑孝于惟孝今于作乎朝聞道夕死可也今也作矣是魯孔丘與曰是是知津矣是魯孔丘與曰是也曰是知津矣擾不輟子路以告子憮然耰而不輟子路行以告夫子憮然置其杖而耘今置作植其斯以乎其斯而已矣譬諸宫牆今諸作之賈諸賈之哉今賈作沽又論語每篇各計其章數其最後云凡二十篇萬五千七百一十字又記諸家異聞之語若曰在於蕭牆之內蓋毛包周氏於今論語無蓋氏毛氏書此石刻在洛陽本在洛宫前御史臺中年久摧散洛人好事者時時得之若騏驥一毛虬龍片甲今張燾龍學家有十版最多張氏壻家有五六版王晉玉家有小塊洛中所有者止此豫皆得其拓本論語之末題云詔書與博士臣左立劉本無立字郎中臣書上臣下皆缺當是著書者姓名或云此即蔡雍書姓名既亡無以辨之獨刻者陳興姓名甚完何其幸歟又有一版公羊不知誰氏所得其末云溪典諫議大夫臣馬日磾臣趙䧕議郎臣劉𢎞郎中臣張文臣蘇陵臣傅楨雜雜未詳下溪上缺溪上當是堂謂堂溪典也此蓋鴻都一字石經然經各異手書不必皆蔡雍也三字者不見真刻獨此一字者乃當時所刻字畫高古精善殊可寶重開元中嘗藏拓本於御府以開元二字小印印之與法書名畫同藏蓋唐世以前未録前代石刻獨此見收其可寶如此立字雜字案石經古本皆有之漢簡辨近嵗關右人發地得古瓮中有東漢時竹簡甚多往往散亂不可考獨永初二年討羌符文字尚完皆章草書書蹟古雅可喜其詞云永初二年六月丁未朔二十日丙寅得車騎將軍莫府文書上郡屬國都中二千石守此五字古本缺丞廷義縣令三水十月丁未到府受印綬發夫討畔羌急急如律令按范曄後漢書安紀永初元年夏先零種羌畔遣車騎將軍鄧隲征西校尉任尚討之二年正月隲為羌所敗於冀西七月戊辰詔有羌貊畔戾夙夜克己之語其年十月庚寅任尚與羌戰於平襄十一月辛酉拜隲大將軍召還則此簡所謂車騎將軍者即鄧隲也所討畔羌者即先零也然以紀所書日月及漢簡參考之簡云六月丁未朔則二十日正得丙寅而戊辰乃此月二十二日也六月末既有戊辰則七月不應復有之而安紀是年復有戊辰之詔蓋紀誤也又據安紀是年七月之後繼書閏月閏月有辛丑九月有庚子亦當復有辛丑則是年閏當在七月據漢簡六月丁未朔則後百二十日得兩丁未故簡又云十月丁未正合也而据紀於七月閏則丁未當在九月矣又與簡不相合亦紀誤也又紀書永初元年夏羌畔遣隲討之二年冬始召還而隲本傳云永初元年夏羌畔於是詔隲將左右羽林北軍五校及諸部兵擊之西屯漢陽冬召隲班師据紀討羌在元年夏召隲在二年冬漢簡亦有二年之文正與紀合而傳云元年召還班師者亦誤也簡書甚明乃當時文字又日月首尾相應非如史之先後差謬宜以簡所書為正於戲千載之下幸是簡偶存得以考正范史所書之誤是以君子貴乎博學而多識也銅戈辨右舟之戈其銘曰舟其質則銅按周官考工記冶氏戈之制有內有胡有援鄭氏曰戈今句孑㦸也或謂之雞鳴或謂之擁頸內謂胡以內接柲者也援直刃也今詳此戈之制兩旁有刃橫置而末鋭若劍鋒者所謂援也援之下如磬折稍刓而漸直若牛頸之垂胡者所謂胡也胡之旁有可接柲之蹟者所謂內也援形正橫而鄭氏以為直刃禮圖從而繪之若矛槊然誤矣蓋戈繫兵也可句可啄而非用以刺也是以衡而弗從故冶氏之職又云已倨則不入已句則不決鄭氏亦云倨謂胡微直而邪多以啄人則不入句謂胡曲多以啄人則創不決既謂之啄則若鳥咮然不容其刃之端上向而直也今觀夏商彛器銘欵有作人形執戈者荷戈者其戈皆橫如斧鉞而鋭若鳥咮又胡垂柲直正與此戈之制同此最可證云其銘曰舟者蓋人名也按陶𢎞景刀劍録夏孔甲之劍銘一字曰甲今內府所藏公非之鼎其名曰非公孫蠆之鼎其銘曰蠆文亦皆一則知舟者亦人名其字象形比他銘識尤古質蓋夏商之器也夫兵器率用利鐵而此戈乃銅為之又今人得古刀劍矛㦸矢鏃之類率皆銅者按太史公秦始皇本紀二十六年收天下兵聚之咸陽銷以為鍾鐻金人十二重各千石應劭注曰古者以銅為兵又按春秋傳僖十六年鄭伯朝楚楚子賜之金既而悔之與之盟曰無以鑄兵遂以鑄三鍾杜預注曰古者以銅為兵夫五金皆金也然秦之金人及古鍾皆用銅則秦所銷之兵與楚盟鄭母鑄兵之金皆銅可知矣應杜之說誠然又按山海經中山西二百里昆吾之山其上多赤銅郭璞傳曰此山出名銅色赤如火以之作刀切玉如割泥周穆王時西戎獻之尸子所謂昆吾之劍者也越絶書曰赤堇之山破而出錫若邪之谷涸而出銅歐冶用以為純鈞越王句踐寶劍之劍近汲冢中得劍一長三尺五寸乃今所名為干將者亦闕五字皆非鐵明古者通以錫雜銅為兵器也又按刀劍録夏少康三年商太甲四年各鑄銅劍一其文曰定光則古之兵器用銅蓋無疑矣况銅為物至精不為燥濕寒暑變其節不為風雨暴露改其形確乎有常若士君子之行是以昔人上之又况形笵正工冶巧火齊得剝脫砥礪其銛至可以剸玉雖楚鐵劍之利亦亡以加顧三代金工鍊液之法亡矣今人所不能為也則古兵用銅而後世不復為者亦奚足怪李賀有金銅仙人辭漢歌鷂雀賦辨頃傳長安人有得思王真蹟鷂雀賦者及得張藝叟侍郎所刻本觀之乃近代僞帖也按草法亦如真行孳乳寖多故後代草字有唐以前所無者如於字必字之類魏晉六朝人草此字止如行書于必如此作至隋唐以來始省為如此作故前輩云于字必字無草書是也今僞書鷂雀賦三字皆如唐人草法此一妄又賦之首既書賦目復冠以曰字此殆妄人録類書中子建此賦書之故妄去去字未詳何本以妄為志曰字其陋如此今藝文類聚亦有此賦此二妄末有武攸暨題字乃作今市井人所作俗古篆仍云以永其𫝊此近人語唐世未之有也此三妄又數印章云唐人印乃與今市肆所作印篆形模字畫無異及末有靜華二字乃摹法帖子敬字中動靜及華新婦字此四妄其末又有子建畫像神氣甚俗衣冠筆勢亦若今畫院畫史所為前人畫不如此也此五妄既作僞帖又畫其像而僞章題署甚多汲汲然恐人之不信也其陋至此而不悟以為筆法在二王上使人駭歎是知非書之難知者亦難此與俗傳石本王摩詰所畫四時山水上有摩詰薛雍等印同科蓋亦今淺俗所為見之令人鄙吝生而士大夫或收藏甚者張於牆壁是可歎也古瓦辨歐陽公研譜云相州真古瓦朽腐不可用世俗尚其名爾今人乃以澄泥如古瓦狀埋土中久而研之然近有長安民獻秦武公羽陽宫瓦十餘枚若今人筒瓦然首有羽陽千嵗萬嵗字其瓦猶今舊瓦殊不朽腐其比相州瓦又增古矣則知相州古瓦未必朽腐蓋傳聞之誤爾王敬武書辨太醫丞樂君珍畜唐人一帖題云委曲付師範跋之者以後有彭城私記為劉夢得書以中云大駕歸定為德宗自興元還時皆非也余按此乃唐平盧節度使王敬武與其子師範書也紙背有王珙署銜甚詳上云謹謹上相公下云從姪保義軍節度陜虢觀察等使珙狀封此珙與敬武書敬武就其紙作家問寄師範耳大駕歸定蓋僖宗自鳳翔還時也按中和元年王鐸為都統征黃巢制授敬武平盧節度使三年進敬武檢校太尉同平章事而光啓三年王重盈入河中留其子珙領陜虢節度事光啓在中和後此珙所以呼敬武作相公自題保義節度銜也敬武書此帖後一載龍紀元年卒師範始為留後余以此考之是帖非夢得書明甚又夢得自以系出中山常著其望而此印章乃彭城彌知非是珍以相示聊為辨之汝州新刻諸帖辨頃在洛中聞汝州新鐫諸帖謂之汝刻其名已弗典矣意謂其彚擇必佳及見之乃大不然雜取法帖續帖中所有者時載之又珉玉間簉不能辨也此猶亡害至其集古帖及碑中字萃為僞帖并以一帖省其文别為帖語及强名者甚多稍識書者便可别之如以逸少帖春秋輒為患不得北軍問逺近清和等語乃擲取北軍逺近春秋等字集為一帖强為王衍書以續帖中諸縣故佳字强名為王楨之書取汝州東漢州輔碑中數字强名為蔡中郎書取衛州魏孝文弔比干文中數行强名為崔浩書如北齊碑便目為溫子升後魏碑便目為沈法㑹如此者甚多且如弔比干文魏孝文作而崔浩之死在太武時乃目為浩書其不稽古如此至若張華帖內雜以寶章集中王慈字薛稷帖中雜以法帖內子敬字皆集成之字意全不相屬取王筠帖中和南清豫一帖疑有闕文如是者不可具載幸世尚多古帖極有未傳者自可刻其全篇何必區區作僞以誤後學但貽識者蚩笑耳汝州既以石十餘刻之而越州復傳其本又刻之二州之石殊可弔也信知識真者少何足怪云楨之字公幹徽之子避廟諱舊改為柾之二館辨漢郊祀志云武帝因公孫卿言仙人好樓居於是令長安作飛廉桂館甘泉作益夀延夀館使卿持節設具而候神人顔師古曰益夀延夀二館也豫按太史公記作益延夀觀而近嵗雍耀間耕夫有得古瓦其首作益延夀三字其瓦長徑尺字書竒古即此觀當時瓦也又按括地志云延夀觀在雍州雲陽縣西北八十一里通天臺西八十步正今耀州地也然則當以史記為正但一觀名益延夀三字耳師古謂益夀延夀二館非是館當從史記作觀觀館古多相通自唐以前六朝時凡今道觀皆謂之某館至唐始定謂之觀也古人用字有相承通用如鵠鶴旌旍之類皆莫原其始觀武帝求神仙勤勤如此卒不遇真而東晉楊君周君乃不出户庭親接靈仙卒皆仙去乃知得道雖假修習然在定分也弡仲􅔆辨劉原父弡仲􅔆銘以隸寫之云弡仲作寶簠擇之金鏖鋭鏖爐其纁其𤣥其黃用盛諸旇􅧤米用饗大正音王置䬫具召飼弡仲受無疆福必共餐飼具􅀈與􅀈同音飽也弡仲眉夀所謂鑣爐即廣雅所載此二字乃趙生所釋豫亦然之然趙初不知廣雅有此語及觀之彌可信也弡音其勿反􅧤側角反早取榖也䬫徒兮反飼音祀弡字原父誤釋為張字遂以為張仲之器歐公從而文之以數百言蓋失之矣古器中又有弡伯敦豈仲之兄乎古器辨鼎屬七甲鼎乙鼎非鼎乃甗也蓋甑之類丙鼎中有人形蓋古子孫字丁鼎戊鼎中文在兩目之間非鼻乃父字耳上兩目乃古瞿字蓋其人曰瞿父也已敦也古盛黍稷器儀禮所謂全敦非鼎也庚此漢人香盧耳非鼎也鍾屬四其三是鍾最後丁號者柄差長當是鉦也尊爵屬四甲是卣中尊也中有人形亦古子孫字乙爵也文曰祖甲丙爵丁爵鑑二甲其文曰仙山竝照智水齊名花朝豓彩月夜流明龍盤五瓀鸞舞雙精傳聞仁夀始驗銷兵文體乃唐人鏡其體製亦不甚古乙銘曰青羊作竟四夷服多賀國安人民一字不明外夷殄滅天下得一雨暘節五資上二字不明長保二親下一字不明凡三十字內有三字不明此乃漢鑑勝前一鑑逺甚乙銘不可曉考之博古圖漢有青蓋鑑銘青羊作青蓋又宜子孫鑑銘五資作五榖熟永建石章辨與滕子濟埀示永建石章珍荷是年龍集辛未故書太嵗在未也我有之者恐與君子有之之意同意不以其魂無知而忘之尚冀其疾來歸也舊有不字從川本去之故云我有之來歸上一字於隸法疑是疾字意謂爾未審果否杜子美詩筆次序辨董君新序稱甫為淑妃皇父碑在開元二十三年最少作也豫按是年甫才二十四嵗宜為少作然按碑文妃卒葬皆在二十年然此碑乃其子壻鄭潛耀令甫作未必在是年碑末云甫忝鄭莊之賓客遊竇主之園林以白頭之嵇阮豈獨步於崔蔡野老何知斯文見託若其葬年所作豈得序稱白頭嵇阮與野老何知哉又其銘云日居月諸丘壟荆把列樹拱矣豐碑缺然則其立碑蓋在葬後六年非甫年二十四當開元二十三年皇父葬時所作也蓋董君不考立碑年但考其葬年故誤爾董君新序稱永泰元年嚴武移山南崔旰亂甫避秦川定後還成都即浮江東欲適吳楚案武卒於成都故有哭嚴僕射詩則武未嘗移鎮山南也又有將適吳楚留别章使君當在武未再尹成都之前非崔旰亂之後此二事舛訛又至鄜迎家後收京扈從還長安董於歸鄜便言移華州漏還京一節王原叔集杜詩古詩甫與章梓州詩及逰惠義寺等皆武初尹之前律詩則在初尹之後二者必有一誤據王序武歸朝廷甫浮遊左蜀往來非一則律詩所序是也古詩田父美嚴中丞一篇次序誤矣原叔以召補京兆功曹不赴欲如荆楚在嚴公初尹前非是蓋律詩寄巴州注云時甫除功曹在東川在武初尹之後故誤也政和四年八月十六日觀杜集二序因正之論飛白法觀唐𤣥度十體書因思張懷瓘云飛白全用隸法蓋八分之輕者今世人為此書乃全用草法正與古背馳矣又鮑照飛白用豪筆乃能成字或輕或重也蓋或輕若絲髮或重若雲山濃淡相錯乃成字若不用豪筆書之則不能若此今觀十體中飛龍二字作飛白書正用豪筆作與散隸頗相近坦當作但增縹眇縈舉之勢又全用楷法洛陽唐恭陵孝恭皇帝睿德之紀及牛口紀功碑首唐太宗飛白亦如此作皆有豪筆㸃掃濃淡之勢而近世相承飛白皆用相思為片板若髹刷然以書殊不用豪筆故作字無濃淡纎壯之變非古也當蔡雍於鴻都下見工人以堊帚成字歸而為飛白之書非便用堊帚蓋用筆效之而已今人便謂所用木筆為堊帚謬矣又云飛而不白又云白而不飛蓋取其若絲髮處謂之白其勢飛舉謂之飛而俚俗讕語又謂蔡中郎見帛飛空中因作此字以白為帛此尤無稽也論臨摹二法世人多不曉臨摹之别臨謂以紙在古帖旁觀其形勢而學之若臨淵之臨故謂之臨摹謂以薄紙覆古帖上隨其細大而搨之若摹畫之摹故謂之摹又有以厚紙覆帖上就明牖景而摹之又謂之響搨焉臨之與摹二者迥殊不可亂也論字小宋太一宫詩瑞木千尋竦仙圖幾弔開注云真誥謂一卷為一弔殊不知真誥所謂㢧即卷字蓋從省文真誥音亦爾非弔字也碧虛子陳景元據真誥以此字即篇字蓋亦誤云論黃陵碑二女黃陵碑引山海經云洞庭之山帝之二女居之郭璞疑二女舜后不當降小水為其夫人因以二女為天帝之女退之遂以璞為失殊不知山海經凡言帝者皆謂天帝如所謂帝之密都帝之下都帝之平圃與帝之二女皆謂天帝也至言帝俊帝顓則各兼稱其號不但曰帝也其論二女一篇最為詳確據列仙傳江婓二女與九歌湘夫人稱帝子者是矣退之難之非也余頃在道山與翁養源論此亦以為然翁於江湘圖志論中其說蓋與余合論書八篇示蘇顯道章草惟漢魏西晉人最妙至逸少變索靖法稍以華勝世傳書諸葛武侯對蜀昭烈語及豹奴等章帖皆逸少書也蕭景喬出師頌雖不逮魏晉人然高古尚有遺風自其書中觀之過正隸逺矣隋智永又變此法至唐人絶罕為之近世遂窈然無聞蓋去古既逺妙指弗傳幾至於泯絶邪然世豈無兹人顧俗未之識耳二張懷瓘論書以㑹稽草書第八在世將茂宏輩諸人下意謂其拘法度少縱放也豫謂草之狂怪乃書之下者因陋就淺徒足以障拙目耳若逸少草之佳處蓋與縱心者契妙寧可以不踰矩議之哉若懷瓘者以形模求字不可告以天下之馬也三昔人運筆側掠努躍皆有成規若法度禮樂不可斯須離及造微洞妙則出沒飛動神㑹意得然所謂成規者初未嘗失今世人作一波畫尚未知厝筆處徒規規强效古人縱成但若印刻字耳四篆法之壞肇李監草法之弊肇張長史八分之俗肇韓擇木此諸人書非不工也而闕古人之闕一字恐是淵字原教俗士之升木於書家為患最深夫篆之方穩草之顚放八分之纎麗學便可至而天一作大勢失矣彼觀鍾彛文識漢世諸碑王索遺蹟寧不少損乎此可為知者道五流俗言作書皆欲懸腕而聚指管端真草必用此法乃善豫謂不然逸少書法有真一行草三以言執筆去筆跗逺近耳今筆長不過五寸雖作草書必在其三而真行彌近今不問正草必欲聚指管端乃妄論也今觀晉宋及唐人畫圖執筆者未嘗若此可破俗之鄙說六凡書橫難從易方正在二者間不悟書意而作衡法不斜則濁此體惟鍾索逸獻真知也宋齊梁人似之陳隋至唐皆不近也七陶隱居集楊許三仙君真蹟論其書云楊君書最工不今不古能細能大大較雖祖效郗法筆力規矩兼於二王掾書乃是學楊而字體徑利偏善寫經畫符與楊相似鬱勃峰勢殆非人功所逮長史章草乃能而正書古拙隱居昔見張道恩善别法書歎其神識今覩三君蹟一字一畫皆望影懸了自思非智藝所及特天假此鑒令有以顯悟爾三君書蹟今無復存獨唐竇臮述書賦著楊真人行書帶名六行觀隱居之論想見其清致也惜哉今亦弗傳矣隱居書自竒世傳畫版帖及焦山下瘞鶴銘皆其遺蹟也今人罕能辨之於戲妙識逺矣古人之知音益稀安得𨼆居道恩輩與之論書哉八王㑹稽七子凝操徽渙獻五人書蹟具傳惟𤣥肅二子未見餘皆得家範而體各不同是善學逸少書者猶顔延年對宋文帝自謂竣得臣筆測得臣文㚟得臣義躍得臣酒書亦猶是也論書六條唐人更不作章草書近來有濟及洪府人强學之所謂不堪位置舉止羞澀終不似真俗人未嘗知古人用筆處見其人書者隨衆稱善皆曰鍾索復出矣不堪位置舉止羞澀乃梁武帝評羊欣書二凡書衡一作橫難從易方正在二者間不悟書意者强作橫書不斜則濁蜀中一人是已此體惟鍾索盡古人之妙宋齊時人似之梁陳隋至唐終不近也三後魏北齊人書洛陽故城多有遺蹟雖差近古然終不脫氊裘氣文物從永嘉來自北而南故妙書皆在江左四洛人好楊凝式少師書信可傳寶但自唐中世來漢晉書法不傳如凝式輩所祖述者不逺㑹稽父子筆法似不如是洛人得楊真蹟夸詡以為希世珍所謂子誠齊人耳五我居清空表君處紅埃中仙人持玉尺度君多少才玉尺不可盡君才無時休此上清寶典李太白詩也六近世書人惟章申公能傳筆意雖精巧不逮唐而筆勢超超意出禇薛上矣比來空一字疑襄字陽號知古法然但能行書正草殊不工愛觀古帖而議論疏闊好摹古帖而㸃畫失真世言其搨本與真蹟同然比李建中周越輩則小過也論虞書千文聞曾家所藏虞帖未曾見但前輩寫千文如智永輩不正即草未有以行書寫者世有歐率更行書千文一卷乃是集其字為之者未知此虞本如何須他日見乃可辨真否也然世人藏虞行書帖如汝南公主墓志積時帖齊㑹帖疑有闕文論張長史書始觀張旭所書千字文至母圖隸散等字怪逸過甚好事者以長史喜狂書故效其蹟及反覆徐觀至鴈門云亭愚䝉瞻仰等字與後題月日則雄隱軒舉槎枿絲縷千狀萬變雖左馳右騖而不離繩矩之內猶縱風鳶者翔戾於空隨風上下而綸常在手擊劍者交光飛刃歘忽若神而器不離身駐目視之若龍鸞飛騰然後知其真長史書而不虛得名矣世人觀之者不知其所以好者在此但視其怪竒從而效之失其指矣昔之聖人縱心而不踰規矩妄行而蹈乎大方亦猶是也嘗觀莊周書其自謂謬悠荒唐而無端涯然觀其論度數形名之際大儒宗工有所不及其道之所以無為而無不為矣於戲觀旭書尚其怪而不知入規矩讀莊子知其放曠而不知其入律皆非二子之鍾期也齊景公招虞人以旌說周官全羽為旞析羽為旌又道路用旌節即此旌也顧愷之畫蘇武所執之旌丄員如幢下復數層紅羽鬖鬖然如夜合花即周官所謂析羽也今鹵簿中節亦頗類此其首亦員相去尺餘有數層員版以氂牛毛綴之亦鬖鬖然蓋析羽之遺法然漢節但旌節之制耳至於龍節虎節玉節之類乃後世虎符之屬是也但可合符者皆謂之節不必盡若旌幢也故漢人所持節俱闕合符之制今觀顧畫節首之下懸一物若書卷疑此可用合符也今鹵簿節乃無此秦昭和鍾銘說此鍾蓋慶歷中葉翰林清臣守長安所得上之大樂考之音中大吕胡恢題云世家言秦侯至穆公十三世而中間出子遇殺豈不得列於世數邪歐陽文忠題云据史記年表始秦仲至康公為十二公此鍾則為共公時作也據本紀始襄公至桓公為十二公此鍾則為景公時作也豫按本紀周孝王命非子曰昔柏翳為舜主畜畜多息故有土賜姓嬴今其後世亦為朕息馬朕其分土為附庸邑之秦使復續嬴氏祀號曰秦嬴嬴生秦侯次公伯秦仲莊公襄公文公靖史記作竫公不立寧公出子武公德公宣公成公穆公康公共公桓公以銘所謂十二公考之若以非子始為附庸則至成公為十二公若以秦仲始為周大夫襄公始為諸侯則如歐陽說至康公以桓公為十二公然據銘云不顯朕皇祖奄有下國十有二公言皇祖奄有下國蓋謂始有土之君則當以非子為始雖曰附庸蓋亦國也况有周錫命分土之文得不為奄有下國乎自非子至成公十有二世則是鍾為成公作無疑矣又所謂十有二公蓋自始祖而下至今為公之數而歐陽公以為十二公者先公也而言作鍾者為十三世亦非也案銘之首稱秦公曰則知見為君者固自稱公春秋時列國皆然不必言先公方謂之公也商著尊說按兩器皆皇祐中得之是時阮逸胡瑗等議以謂此器有脰無足據有脰則可名壺尊著地無足則可名著尊是時逸與瑗未能定其主名今按凡以尊名者未嘗無脰則脰不足以别尊之名而足之有無乃可為異此器既無足自可謂之著尊不必因其有脰而以壺尊致疑也鼎之無足者曰著鼎義亦如此禮明堂位商尊曰著今觀內府古器中有周之著尊文飾華巧脰作夔龍蟠屈之勢腹著雲靁回旋之狀而足皆著地蓋因於商禮而加文耳今此二尊形模古質殊無蟲鏤第以獸飾腹以雙耳挾肩比周物為朴正商代之著尊也腹之獸首若傅翼而飛舉然觀古寶器有為蚩尤之象者皆為飛獸而傅以肉翅昔人著其狀於彛器者以示貪暴之戒此尊之飾蓋蚩尤也商素敦說按古敦之存於今者若周宰辟父敦散季敦牧敦戠敦虢姜敦之屬率皆有欵識言時稱伐比他器為詳大抵皆周器也此敦中無欵識外無文鏤質古不華疑若商器然又諸敦之有銘者往往皆宗器也此既無銘豈非燕饗所用與周大方鼎同義乎其制為兩蜼首以吞吐雙耳下有兩珥承之猶其尾然蓋若宗彛之章以智為義傳曰知人者智夫智足以灼見俊心而知之故得忠臣嘉賔而饗之然後得盡其心而成其禮然則燕饗之敦設飾以蜼其意或寓於斯商山觚圜觚說按禮爵一升觚二升此三觚容受宜其比爵為多山觚之脰飾以四山下為觚稜圜者但觚而已昔人所謂破觚為圜故或稜或否具此二者不獨稜者謂之觚也此器用以酬酢故脰足之間可握可拱蓋臣拜君酢跽而受之端而飲仰而奠於地復拜與圭勿日相為用自與至用川本去上七字故其為拱握之制而其腰間有穿若交午然蓋奉執之際貫之組以防墜失與圭之必璧之好同義亦於宴飲之間象君臣之志通而無沉湎之失也三觚制作合度而鮮文飾蓋商器耳周貍首豆說按古寶器之有豆往往小殊而大同若姬寏母豆則鏤以山雲疑生豆則承以四拱螭足豆之制有㑹可仰祖癸豆之像其足無趺此豆之足殊類祖癸雖冶鑄非精而模矩質素蓋商代所作云其側獸面若貍首者案射義諸侯以貍首為節貍首之詩逸矣其義弗可知然即名以求其義蓋取所田之物為名貍獸之小者言小獸則大獸可知故國君用射於田以所獲禽一為乾豆蓋以祀事為先此豆飾以貍首義或出此其廟享之器歟周史伯碩父鼎說右二器形制欵識悉同而文字刓缺以二鼎參讀而互辨之可識者四十有三字不可見五字而已按史伯周宣王臣碩父其字也鄭桓公為周司徒問王室於史伯史伯具以諸國及晉楚所以興對春秋外傳是之而漢書古今人表於厲王宣王時皆書史伯疑非二人蓋羡文耳此二鼎銘文著史伯碩父所以作鼎曰朕皇考釐仲王母舟母尊鼎而周器之拓文有曰史穎作朕皇考釐仲王母舟母尊鼎欵識字畫大致皆同則知穎者蓋碩父之名三鼎之文互相見耳考之經傳周有史佚衛有史鰌晉有史趙率以官為氏故碩父之名與字皆冠以史曰伯者蓋五十所加猶伯陽父仲山父之類是也又幽王之臣有虢石父而晉有伯石於碩父亦近之然虢石父虢公也未嘗為史而晉之伯石乃楊食我耳非天子之命卿弗可稱伐於鼎是知史伯碩父非此二人也古文周與舟同史伯周臣故稱其王母曰周母猶周之姜任大姒號曰周室三母亦以國著也以斯銘考之釐仲者史伯之皇考而周母其王母也今先釐仲而後周母則釐仲實王父耳下言王母則上為王父可知故但曰皇考銘之首曰惟六年八月初吉己子以己配子則於十日剛柔疑若弗類然三代鼎彛銘刻若此者甚多有之兄癸彛文曰丁子周戠敦文曰乙子今此鼎文曰己子是也或曰戊與己同類古尚未分則所謂己子乃戊子也或曰易之五位相得而各有合以配十日若甲與己合古亦未分則所謂己子乃甲子也丁子乙子義亦如之其說未知孰是銘之卒章曰用蘄綽綰眉夀晉姜鼎銘亦有此語蓋祈天永命俾弗中絶故曰綰埀裕後昆俾昌而大故曰綽與萬年子孫永寶同意皆善禱之辭也鼎唇之文鏤為龍與叨餮之象而腹皆作龍鱗與周寏父鼎頗相類皆合而成體散而成章之義所謂龍文之鼎蓋取諸此周舉鼎說銘欵一字案古文舉字也三代彛器有此文者頗多如爵有己舉卣有丁舉之類是也戴記晉杜蕢洗爵揚觶以規平公時人因謂之杜舉蓋爵觶之屬可舉以獻酬之器故或目以舉今此鼎亦銘以舉而但一字又非可舉以獻酬之器則此所謂舉乃人名也與杜舉己舉異矣以載籍考之宋之僖公名舉楚有大夫伍舉下蔡有史舉燕有唐舉雖皆周人然史舉賤而為監門唐舉微而為相者又皆周末人而此鼎乃非晚周之器今驗其銘欵若非宋僖公舉則伍舉也僖公微子之後與周始終伍舉莊共之大夫為楚聞臣宜其制作傳永而不亡然傳以諸侯言時計功大夫稱伐為銘之法而此鼎特著名而不紀績亦猶公非之鼎弟銘以非公孫蠆之鼎弟名以蠆亦一字爾周宋公鼎說銘欵六字有蓋銘六字按此鼎銘曰宋公䜌之餗鼎䜌者宋景公也以史記年表考之則名頭曼以漢書古今人表考之則名兜欒獨汲冡師春書宋之世次曰景公䜌者昭公子與此銘合當以䜌為正然頭曼兜欒音讀相混漢書稍近之苐不知何據而云兜欒或景公初二名而後一之若漢昭帝初名弗陵而後但弗也此鼎與宋君夫人之餗釪鼎字畫體一而釪鼎之蓋文鏤繁縟此鼎則朴素無華豈當時以是别君與夫人之器邪以文字稽之乃一時物也至於周䜌女及䜌亦人名苐字畫意象視餗鼎為古則䜌與䜌女之器疑非景公作蓋前此别自一䜌耳微欵識作與微同妙也周方鼎說按古寶器鼎之方者多矣以其銘欵考之魯公文王方鼎則謂之尊彛單子方鼎則謂之從彛王伯方鼎則謂之寶齍惟陀員庚申方鼎乃謂之鼎然則諸器制度大概相類以其可尊而為法曰尊彛以其陪二而非正故曰從彛以其或用於齊盛若九嬪之贊玉齍故曰寶齍其實皆鼎也故鄭公孫僑辨黃熊之夢晉平公賜以莒之二方鼎亦止謂之鼎今此二器制度與諸方鼎同蓋周器也故目以周方鼎其大也幾可以函犧牛之全體其文鏤也淳美而不太華其中也略無欵刻蓋用於王之燕饗而已與銘祖考之功而為祀器著自作之時而為養器異矣他器無欵刻者殆此類也此鼎腹之四周皆飾以乳其數比他器為多蓋亦推己以致養之義夫天地養萬物聖人養賢以及萬民先王宴饗以厚羣臣以仁嘉賓亦以養之也易鼎之彖曰聖人亨以享上帝而大亨以養聖賢此鼎形特大而乳極多蓋大亨以養聖賢之意得不為燕饗器乎鼎之四足皆銜以羊體所謂羊鼎也又養於文從羊庠也美也亦如之皆有致養充實之義此飾以羊意亦寓此鼎之唇緣其文鏤也合則為叨餮以著貪暴之戒散則為應龍以見居上澤物之功凡龍之有翼曰應龍此器之龍如之至於足之中空上徹於底而無礙則以澄肉洎之滓濁兼取其易飪耳三代制器其寓於理也詳其適於用也周故曰百工之事皆聖人之作也不然何以底此周寶和鍾說右二鍾銘皆曰走作朕皇祖文考寶和鍾走其萬年子子孫孫永寶用享按尓匹唐虞曰載夏曰嵗商曰祀周曰年以此銘考之祝以萬年蓋周器也走之名於經傳無見蓋昔人自以稱謂猶孤寡不榖臣僕愚鄙皆謙損之辭故司馬遷自稱曰太史公牛馬走班固自稱曰走漢書作僕文選作走亦不任厠技於彼列說者謂以猶今自稱下走之類此器所謂走者如此然則走之號非獨始於漢蓋亦上矣此銘上言走下言朕與左氏所謂吾祖也我知之同意其曰皇祖文考者按左氏衛莊公之禱曰敢昭告皇祖文王烈祖康叔文祖襄公此所謂皇祖文考者亦猶衛侯所謂皇祖文王也走者周之宗室亦文王後故稱文王曰皇祖昔武王伐商以造周嘗稱文王曰文考至其子孫距文王逺矣猶曰考者蓋推本而言之至若賡之文考尊師艅之文考彛戠之文考敦但曰文考而不曰皇祖其皆周初之器乎與此鍾異矣是鍾於于鼓之間飾以雙鳳側著一字亦象鳳形若周烏鍾之制昔周之興也鸑鷟鳴於岐山蓋在周文王之世而君奭有曰我則鳴鳥不聞孔子亦思鳳鳥之至皆有懷於文王鸑鷟鳳類也二鍾之飾其鸑鷟歟所謂作寶和鍾者按國語泠州鳩之論鍾曰大昭小鳴和之道也和平則久久固則純純明則終終復作樂所以成政也故秦銘勳鍾名曰昭和鍾而此名曰寶和鍾意蓋若此文王以徽柔懿恭之德修和有夏後世於禮樂聲容之間皆象其德故相禮於清廟則曰肅雍作樂於鍾則謂之寶和和平則久克成厥政宜子子孫孫寶用以傳永也周雲靁鍾說按此鍾形製與諸雲靁鍾同特於于鼓之側别飾以一雲一靁亦猶周鳳鍾烏鍾於于鼓之側特為一鳳一烏以代銘欵則知是鍾蓋周器也靁動而風行所以鼓萬物雲族而雨流所以澤萬物先王作樂崇德感人心而天下和平鼓而澤之莫大於是故雲靁之象不特識於鼎彛以設義於飲食之間而作樂之意蓋亦有寓乎此者周罍周洗說案冠禮設洗直士冠禮音值于東榮水在洗東燕禮設洗于阼階東南當東霤罍水在東說者以謂水器尊卑皆用金罍此罍與尊罍之罍名同而用異夫行禮之始務於自潔故以罍洗為先洗於文從先用是故也罍洗設於東南而靁鼓以春夏罍於文從靁用是故也古之制罍既用金洗亦當然此罍也洗也其制皆金洗之飾以龜魚以涓潔為義罍之飾以雲靁以潤澤為義是二器也形制淳妙意象高古非周人不能為也又其出也同地其得也同時以罍承洗合若符棨而祕閣舊籍以洗為瓫以罍為缶初未知其為是物也臣等因受詔撿校而考辨之主上聖心灼見其然命有司取其制度以備新作禮器之一乃知此器自周訖今載祀千餘隱祕弗見以待聖人制作而後顯於戲豈不韙歟豈不韙歟周一柱爵說素爵附案古爵皆設兩柱用以反坫則相承而安此前二爵制皆一柱覆則欹倒豈以一於飲而不知節則有顚隮之患用為彛酒之戒歟亦猶欹器以覆戒滿之義也四器皆無銘欵其一腹篆隱起為叨餮雲靁之象文鏤深明蓋周人所作其一差簡於前亦同時也後兩柱爵朴素無文然亦周器苐非燕享所用耳周雲靁斝說按禮爵夏以盞商以斝周以爵三器之名雖殊其實皆爵也以其三足象戈故曰盞以其兩足文以禾稼故曰斝以其形若飛爵然故曰爵形若爵者取其猶爵集以春夏仁且有禮也柱以禾稼者取其飲以養陽而資於尊所以上之也戈其足者所以示飲之戒傷斯為下矣斝之制與爵同但多無咮尾此為小異耳其義則一也此斝腹柱皆飾以雲靁柱則略為禾稼腹則雜以叨餮叨餮之為物食人未盡還齧其軀又其目在腋下山經所謂狍梟者故多以飾器之腋腹象其本形示為食戒而杜預謂貪財為叨貪食為餮以此器觀之則是象非特為財與食之戒亦以警彛酒也後一器文鏤差簡然皆周器周具三代禮所以兼用商爵周螭足豆說按此豆體中素質無文與姬寏母無異然器之足篆以盤螭是亦周器也其蓋則可覆可仰可用以食古之簠簋鼎敦之蓋亦如之其名曰㑹特牲饋食禮曰佐食啓㑹卻于豆南此謂佐食者取㑹卻置而奠之以待尸入而食也公食大夫禮曰賓卒食㑹飯此謂取飯於敦仰㑹而食置其餘以待餕也豆雖以盛菹醢其食也亦仰㑹取而嚌焉非特於義為安蓋亦適於用周素盫漢小盫說按說文曰盫覆蓋也蓋盛滫飯之器加蓋以密之其蓋可卻以分食若鼎敦之㑹然觀晚周之器有卭仲孫伯戔之饋盫與此前二盫形制略同然彼有蓋文鏤繁縟此亡其蓋而復無文亦周物也後一小盫雖有文鏤而無古韻蓋漢世所為宋䪫鍾說右宋䪫鍾六其銘欵曰宋公成之䪫鍾崇寧三年甲申嵗得於南都之崇福院尋貢之內府考其文則宋鍾原其出則宋地也聖詔有曰得英䪫之器於受命之邦即此鍾也是時帝作大晟即取以為鍾法謹案樂緯叶圖證曰帝顓樂曰六莖宋均注曰能為五行之道立根莖也䪫即古文莖帝顓而後歷帝嚳唐虞夏商以及于周六莖之制其傳可謂逺矣然周備六代之樂雲門咸池韶夏濩武皆存特五英六䪫無之惟宋商之後故宋公猶得其傳成者平公名也宋自微子啓二十六世而至平公其名始見於魯昭公之十年春秋書曰宋公成與此鍾銘合而其立也以周簡王之十年乙酉嵗距皇朝崇寧三年甲申凡一千六百八十年而䪫之器出於受命之邦適丁聖上駿惠先烈登崇耆英制作之盛際也大晟既成神人以和治音洋洋際天蟠地豈特為五行之道立根莖哉且莖鍾雖鑄自宋公而實帝顓之樂今也地不愛其寶為時而出蓋以昭聖上盛德茂功比隆五帝夏商以還弗足儷也又古鍾之得於今者惟周為衆其制類多上設衡甬旁傅旋蟲或內實而側埀之或仰通而中貫之率皆振掉弗安惟䪫鍾也雙螭蹲踞以為平紐大晟之鍾實取則焉故其埀之也正其鼓之也和而無振掉弗安之患此其制作所以過於三代也非五帝之樂何以及此漢金錞說案周官鼓人以金錞和鼓說者以謂其形圜如碓首上大下小今此器制度如此一名淳于南史稱齊始興王鑑為益州刺史有以淳于獻者高三尺六寸六分圍三尺四寸圜如筒色如漆甚薄上有銅馬以繩系馬去地尺餘灌之以水又以器盛水於下以芒莖當心跪注淳于則聲如靁清響良久古所以節樂也今此器上有蹲獸可系以綆與南史之說同但錞首巨而圜下乃寖小非若筒也及舂之於地則聲自上發回旋鍧磕於錞之首磅礴不散甚大而宏亦若靁然清響良久不必注以水而振以芒也此器本六長短相第其三已歸內府制作尤工皆周器也今此三器其一有漢泉文蓋漢器耳周錞之系獸卭首卷尾為蜼之狀蜼智獸也智於方屬北隂陽相辨之時也王安石以錞於文從金從孰謂隂與陽和而孰故曰和鼓以義考之和則可否相濟辨而和和而孰隂陽辨於北之時如之宜和鼓之器飾以智物是器也祕閣舊籍目之為鍾初未知其為錞臣等受詔彚分而物辨之稽經而合庶可備采擇之一焉漢螭文瓿說按說文瓿甂也大口而卑用以食此器如之劉歆戲揚雄有覆瓿之語雖出於善謔然當時覆此器必以巾冪之屬為無蓋故也今此器但可出納而無蓋又設飾纖巧頗乏古象正漢世物也漢象形壺說按壺之象如瓜壺之壺豳詩所謂八月斷壺蓋瓜壺也上古之時窪尊而抔飲蕢桴而土鼓因壺以為壺後世彌文或陶或鑄皆取象焉然形模大致近之不必全體若真物也今此壺形羡若真壺然殆漢世取象太巧故爾漢小方壺說按燕禮司宫尊于東楹之西兩方壺今此壺形製絶小非所以尊於階楹銅薄而弗精非三代上齊之品與武安侯鈁相類蓋漢世物也鈁即方壺之别名海上之山亦謂之方壺其象如此古之為器必具方圜壺之有方壺猶鼎之有方鼎蓋備乾坤之象辨君臣之義故說者謂燕禮之方壺為卿大夫而設以臣道直方義蓋地道也臣道也舉一器可以兼之宜其用於燕禮漢漏壺說按漢器有丞相府漏壺與此形製同而上有蓋蓋有方空所以出納箭下有流筒若渴烏然所以節水也此方有疑作其字蓋餘製皆同然彼器修九寸耳而此乃長倍蓰之者蓋孔壺為漏浮箭為刻水之循環有升降則器之出納有大小視今之漏壺制大小長短相次若陛墄然則漏之有壺宜不一而足東觀餘論卷上
