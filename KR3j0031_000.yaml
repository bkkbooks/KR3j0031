body:
  text: 御製題明版東觀餘論米已闢王黃斥米見黃伯思序論從來聚訟每紛如千年下議千年上幾事實當幾事虛筆正明言在心正古書垂法示今書重摹淳化加評訂也覺斯之未信豫欽定四庫全書子部十東觀餘論雜家類二雜考之屬提要臣等謹案東觀餘論二卷宋黃伯思撰伯思字長睿號霄賔又自號雲林子昭武人政和中官至祕書郎伯思沒時年僅四十而學問淹通李綱志其墓稱經史百家之書天官地理律厯卜筮之説無不精詣又好古文竒字鐘鼎彛器欵式體製悉能了逹辨正所著有法帖刋誤二卷古器説四百二十六篇紹興丁邜其子䚮稡其所著論辨題跋合而刋之總名曰東觀餘論然䚮跋稱共十卷今本僅二卷或後來傳寫所合併所載古器亦不足四百二十六條則疑䚮於其未定之説有所去取較務矜繁富不辨美惡徒誇祖父之長而適暴所短者其識特髙又書録解題載伯思博古圗説十一卷凡諸器五百二十七印章四十五無古器説之名又稱後來修博古圖多採用之疑為官書既行之後其名適同亦䚮改題之以避尊也其書頗譏歐陽修不精考核而樓鑰跋中乃􅎥書中史籀書一條異苑一條王獻之璇題一條勿勿一條甘蔗帖一條糾其疏漏蓋考證之學本無盡藏遞行掎托不能免也要其精博勝集古録多矣乾隆四十六年四月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
