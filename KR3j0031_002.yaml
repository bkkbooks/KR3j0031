body:
  text: 東觀餘論卷下宋黃伯思撰跋西嶽華山廟碑後歐陽文忠集古録云所謂集靈他書皆不見惟見此碑某按漢書地理志云太華山在華陽南有祠集靈宮武帝起又桓談仙賦敘云華山下有集靈宮漢武帝欲懷集仙者故名殿為存仙門為望仙二書所載其詳如是則集靈宮不獨見於此碑也文忠博古矣猶時有舛漏後學可忽諸黃某記跋四皓碑後四皓之目始見於法言及漢書王貢傳序相承讀之曰園公曰綺里季曰夏黃公曰甪里先生前賢未始有異故王黃州元之在汝州有詩云未必頸如樗里子也應頭似夏黃公而畢文簡公嘗譏評之以謂不當云夏黃公蓋杜子美詩云黃綺終辭漢謂之黃綺則四皓之目宜曰園公曰綺里季夏曰黃公曰甪里先生也僕初亦以為然蓋逸少有尚想黃綺帖陶淵明詩亦云黃綺之南山又曰且當從黃綺皆可以為證然近嵗商於耕夫得漢世石刻數種有云圈公神坐綺里季神坐甪里先生神坐又各有神祚機皆漢人隸書其號不應誤則與文簡之説異矣當以石刻為正宜從舊目則前人所謂黃綺者特各取一字以目二人不必皆其首字也又園公石刻乃為圈公蓋二字音文為近或册牘傳寫之差亦當以圈為是按顏師古匡繆正俗有圈稱陳留風俗傳自序云圈公之後圈公為秦博士避地南山漢祖聘之不就惠太子即位以圈公為司徒以是書證之圈姓愈曉然矣今尚有圈姓者姓氏書多以圈為園公之後此又可證云黃某題跋干祿字碑後歐陽文忠言楊漢公謂此書以工人用為衣食之業故模多而損速者非也蓋魯公筆法為世楷模而字書辨正訛謬尤為學者所資故當時盛傳於世所以模多爾豈止工人為衣食業邪此論甚善但云漢公模本多失真則不然今觀此書精隱徑媚殊得顏真楊自以為不差纖毫信矣然文忠又云干祿之注持重舒和而不局促余輒易之曰持重而不局促舒和而含徑氣乃盡魯公之筆意也崇寧壬午嵗九月十二夜試姑蘇仲璋筆余自得此碑幾三年凡三題卷後而字勢各不同雖似稍進然猶孩稚形骨嵗殊月異不同未若老成風格成就也更當力學以追昔人跋逸少破羌帖後破羌帖今在米淮陽家崇寧癸未春米在都下以泉十五萬得之後有開元印記及陶穀等題字余嘗跋之云晉穆帝永和十二年秋桓溫破姚襄于伊水遂至洛時將以謝尚鎮之屬病不行此帖所敘桓公摧破羌賊及喜仁祖小差正當時事也是時逸少去會稽內史已嵗餘方遁迹山水間宜不復以世務經懷而此書乃歎宣武之威略悲舊都之始平憂國嗟時志猶不息蓋素心如此惜其一憤遠引使才猷約結弗光於世獨區區遺翰見寶後人覽之深為興歎跋黃庭經後黃庭世有數本皆刓缺不全獨此本字畫具存乃慶厯中摹者然氣象猶在不可以近而忽之也跋陳孝義寺碑後徐陵文非佳而頗有內典故事又徐嶠之書有法故漫録之跋蘭亭傳後川本無甲申嵗八月十一日夜因臨蘭亭閲法書要録見此記文詞繁瑣戲為刪潤但筆孏不能好書當俟他日别寫長睿題跋白傅書後樂天書不名世然投筆皆契繩矩時有佳趣乃知唐士一作世書學之盛如此乙酉嵗閏月八日書跋文會圖後文會圖世傳閻令畫然圖中有奚官捧笏囊者豫初疑之以為唐史載張九齡體弱有醖藉故事公卿皆搢笏於帶而後乘馬張獨使人持之因設笏囊自九齡始閻令之殁距九齡作相凡六十年不當此畫已作笏囊也然豫按梁職儀云八坐尚書以紫裹手版通志云令録僕射尚書手版皮紫褁之梁中世以來唯八坐執笏者以紫囊之假成式酉陽貶誤中嘗引此以為不始於陳希烈則笏囊自蕭梁以來有之不特從九齡始也閻令之畫笏囊蓋無足怪崇寧乙酉嵗三月十二日手摹此圖因書卷末黃某長孺父記跋李邯鄲撰御書閣記後川本無崇寧丙戌嵗元日黃某在興仁府外氏任太師第登閣敬觀美成龍章因覽是碑愛其文辭雄蔚遂躬録之跋崇寧所書真誥册後真誥所載楊許三公往返書牘語存而迹逸深可嗟慨故聊書之殊愧詞翰不倫也然豫書格本出魏晉知者觀之亦可以求古人之筆意丙戌嵗三月二十日書陶貞白云按三君手迹楊君書最工不今不古能大能細大較雖祖效郗法筆力規矩並于二王掾書乃是學楊而字體徑利偏善寫經畫符與楊相似鬱勃鋒勢殆非人功所逮長史章草乃能而正書古拙符又不巧故不寫經也隱居昔見張道恩善别法書歎其神識今觀三君迹一字一畫便望影懸了自思非智藝所及特天假此監令有以顯悟爾此段見真誥第十卷去十七字跋真誥書秦漢間事後此跋三十五字乃真誥全文右此前十條並楊君所寫録潘安仁關中記語也用白箋紙行書極好當是聊爾鈔其中事跋祕閣續法帖後崇寧丙戌夏調官上都寓城南昭化坊李表伯舍旅食無事因假信安劉丈賜本自摹凡十卷用桐紙六十枚凡再浹月乃竟晴窗潔几寂無塵慮從容填郭纎微弗差第此書當時緒次間有乖舛及第十一卷文陋書惡姑因其舊弗刪除云惟此卷逸少諸子書中乃有𢎞白一帖書既惡甚語尤淺俗繆厠諸王間殊為不倫故十卷中止去此一帖耳然第四卷中得四月三日問一帖尚可刪也長睿父書跋杜正獻公草書後高適五十始為詩而與李杜抗行正獻公莫年乃學草書筆勢翩翩遂逼魏晉孰謂秉燭不逮書遊哉於戲公之用也忠猷亮節著於朝廷其退也直心徑氣寓於翰墨故觀此書者可以得公之為人跋劉次莊戲魚堂記後摹本劉御史書最妙小楷其原蓋出王大令褚河南而能兼采羣書為一家雖體本媚弱行草差劣然求之今世亦非多有此帙所録魚記最善其後數刻皆不逮也石蒼舒書雖有骨氣而失于粗俗視劉遠矣跋滑州崇壽寺杜師雄留題後某緣漕檄東郡事已還雒舍此觀壁因知宗將軍碑在胙城深慰懷明過當觀之大觀丁亥六月初十日胙城攝宰李顏送黃將軍碑乃黃景雲父羅剎碑虞永興為秦府學士時撰非其書也跋鍾虞二帖後摹本唐文皇論鍾元常書云體則古而不今字則長而逾制今觀世傳逸少臨鍾書尚書宣示及破關羽帖并此表字皆匾闊殊無長體豈文皇誤以廣為修乎竇臮述書賦云小鍾帶名行書一紙六行虞松草書具姓名一紙十一行此卷鍾虞二帖正與此同當是竇所見者虞松者所謂名微格高復見叔茂體裁簡約肌骨豐嫭如空凝斷雲水泛連鷺者也王小令一帖尤可愛清麗婉雅將逼子敬駸駸欲度驊騮前非虛語也大觀元年十月五日長睿書跋仁智圖後右列女圖自密康公母至趙將括母凡十五圖考於劉向傳此乃畫仁智一卷像也所題頌即傳所載王回傳序云人嘗見母儀賢明四卷於江南人家其畫為古佩服而各題其頌像側與此正同豫按列女之目七古皆有畫世所傳特母儀賢明仁智三圖而已今江南二圖亦復亡軼獨此仁智一卷在焉彌宜珍録故手摹之大觀元年季冬望日王回列女傳序云吕縉等各言嘗見母儀云云跋東府所書急就章後川本無紹聖疆圉赤奮若春三月東府草書急就章計書此倐十二年其中可興慨者多矣大觀二年二月二十四日夜長睿題跋韋鶠十馬圖後韋鶠十馬後有元和李丞相吉父題字真佳迹也少陵有韋偃畫馬詩偃當作鶠蓋轉寫之誤閣中集名畫記唐志皆作鶠云大觀戊子嵗三月初吉黃某書李伯時曾寫閣中集名畫記跋晉人帖後此帖字雖可愛而不類晉人語恐偽當是虞永興書自晚以下四帖亦非逸少語當是後人集其書為之戊子嵗三月二十三夜觀跋破羌跋尾卷後川本無此去年書今觀如覺微進何時一超直入古人地乎執筆增慨大觀戊子嵗七月二十八夜東齋書跋所書真誥數紙後川本無數日夜旦考校殊無間功今日已竟燈前觀陶華陽真誥戲書此數條吾於書字比今人差知古意非於漢魏晉諸人書中遊心者不愛大觀戊子八月十九日夜論秀堂書跋摹本王逸少尚書帖後川本無右王逸少尚書十二帖凡六十二行五百十有三字黵二滅一注五缺七字大觀戊子嵗八月二十六日癸卯洛陽官廨裝雲林子書跋世説第三卷後川本無大觀己丑嵗八月十日夜於洛北應天寺挍此卷時迎奉三聖御容同舍宿者留守判官劉亨道府推官張東美河南丞王質夫長睿書跋漢小黃門譙君碑後此碑稱敏之先譙贛能精微天意傳道與京君明即漢書稱京房治易事梁人焦延壽字贛者也而碑乃云譙其氏姓不同如此豈聲文相近承傳之訛歟抑作碑者妄引以為譙君之先歟然二漢相距非甚遠為金石刻不應舛午是知册牘所傳其失多矣左氏僖公二十三年秋楚成得臣帥師伐陳討其二於宋也遂取焦夷城頓而還杜預謂焦今譙縣也據此説則焦譙亦通音也近世有信安何籀者以隸書知名目是碑為蔡中郎書未知何據自謂學此法清徑有古意與梁孟皇行筆正相反豫謂漢世隸法至魏大變不必梁蔡勢自爾也此碑意象古雅在繁常侍蔡稿長二碑上借非中郎自可師法大觀三年八月癸未西都掾廨裝長睿書跋世説新語後川本無世説之名肇劉向六十七篇中已有此目其書今亡宋臨川孝王因録漢末至江左名士佳語亦謂之世説梁豫州刑獄參軍劉峻注為十卷採托舛午處大抵多就證之與裴啓語林近出入皆清言林囿也本題為世説新書假成式引王敦説澡豆事以證陸畼事為虛亦云近覽世説新書而此本謂之新語不知孰更名之蓋近世所傳大觀己丑中夏七日從宗博張府美借觀兩月因讐正所畜本此本出宋宣獻家比世所行本殊為詳備但絫經傳寫頗有脫誤耳己丑中秋日借張府美本校竟庚寅五月二十九日又以宗正趙士􅌔明發本挍竟八月晦又以西都監大內內省供奉李義夫本校第十卷跋百家詩選後王公所選蓋就宋氏所有之集而編之適有百餘家非謂唐人詩盡在此也其李杜韓詩可取者甚衆故别編為四家詩而楊氏謂不與此集妄意以為有微旨何陋甚歟跋章草急就補亡後自秦同書文丞相斯作倉頡篇中車府令高作爰歷篇太史敬作博學篇至文園令相如作凡將篇黃門令遊作急就篇皆書文之林苑欲識字者不可不知惜哉凡將以上不可復見特急就存焉者以昔賢多喜書之故也其文雖出小學家而亦西京文氣未衰之際詞致雅馴故顏籀賞其清靡籀注此書嘗得皇象鍾繇衛夫人王會稽等篇本備加詳核今世所傳惟張芝索靖二家為真皆章草書而伯英本秖有鳳爵鴻鵠等數行至靖所書乃有三之二其闕者自母繜而下才七百五十字此本是已蓋唐人摹而弗填者神韻筆勢古風宛然豫遂手拓一通陶隱居謂之填郭書近世謂之雙鈎書蓋欲知筆徑所自故爾豫既手拓復補其遺字於卷終因以備忘云大觀己丑嵗十月朔黃某書跋右軍甘䉀帖後摹本此帖中云甘䉀當從草此姑存其説而見於後跋語中非十丈初不可曉因思曹子建詩云都䉀雖甘杖之必折十丈云者恐若木千章竹萬箇之類䉀似竹於文從焉此帖以之俗從草非是跋右軍論諸葛昏書後摹本此卷有論諸葛昏書案晉謝石嘗求昏諸葛恢稚女恢不許及恢亡乃成昏於時王右軍往謝家看新婦猶有恢之遺則威儀端詳容服光整王歎曰我在世説作我在别本作諸葛在非遣女裁得爾耳始不知此何與逸少事而嗟賞若此及觀此帖乃云二族舊對故欲結援諸葛若以家窮自當供助昏事又云欲速知決始知右軍為主兹事故觀謝婦發此歎也己丑嵗十一月十九夜長睿書跋蜀道圖摸本顧長康愛嵇叔夜詩因為之圖而埀綸長川目送歸鴻等語彌灼灼在人耳目畫之不可已如此此畫劉本此畫字作之畫也雲勢岫色林谷明藹皆有逸趣非嘗歷蜀道而知少陵詩意者未易逮此大觀四年二月日書跋輞川圖後世傳此圖本多物象靡密而筆勢鈍弱今所傳則賦象簡遠而運筆徑峻蓋摩詰遺迹之不失其真者當自李衛公家定本所出云大觀四年三月初吉會稽黃某書跋景福草書卷後唐昭宗景福三年正月改元為乾寧此書乃是月作而猶用舊號者當是詔令未至燕地也此卷作草書應規入繩猶有遺法然僧書多蔬茹氣古今一也大觀四年四月十一日長睿書跋大滌翁論書帖後章申公書暮年愈妙一以魏晉諸賢為則此其正書殊類逸少所臨鍾書尚書宣示意象高古非可以近世倫擬也而論據端確評裁曲盡非深于書者不能識之然此卷論薄紹之氣質比羊欣以下乃申公自論前此皆法書要録中語也申公戲寫之耳跋蘇顯道求章草卷後川本無蘇顯道以此紙求僕章草急就篇既為之書并書出師頌等三篇及於紙尾論書數條以盡此卷字勢筆迹雖愧昔人然不知魏晉以先書法者願勿示之大觀四年六月庚寅黃某長睿書跋藏真書後藏真此書殊合作授裳像爽等字雜章草法彌足愛也大觀四年季夏九日跋吉日圖後顧長康畫列女圖中有蘧伯玉車形筆勢與此田車了無小異且三車一作軍之士方從禽馳騁而神韻安間若中禮容非顧陸遺迹不能逮此博陵之筆縝細而此圖簡古裴公以為無有異于閻令何邪大觀四年十月五日閩人黃某觀跋章草仙真詩後章草法絶久矣豫師友鍾索王蕭於千嵗或冀倣佛徐君求豫書仙真詩豫所欲書詞指皆高妙玄邈超然出陔紘之外不應以世俗書書之遂為作章草自靈山造太霞而下凡十有二篇云大觀四年十月六日跋石晉熊曒詩後劉夢得言八音與政通文章與時高下昔人是之五季道衰文喪當是操筆牘士率皆哇俚淺下亂雜無章其間能遠不忘君志在憂國文雖膚近而忠誠可取若曒者蓋鮮儷也余讀其上國音書絶二十篇及晉末感興諸詩而悲之蘇君又出當時集藁示余雖不脫爾日風範亦時有佳語自可傳後無疑大觀四年十一月望閩人黃某長睿觀跋蘇氏篆後漢甄豐稽正古文字其一古文魯堂壁中書也其二竒字即古文而異者也古文高質而難遽造若三代鼎彞遺篆是已竒字怪巧而差異工若漢劉棻從揚雄所學及近世夏鄭公集四聲韻所載是已今人往往不能辨之遂盡以竒字為古文焉武功君於篆法工矣必能辨耳豫恨不獲一靣苐觀遺迹使人慨然跋蘇氏書後僕自弱齡喜篆法初得岱宗秦刻及朝那石章學之後得歧鼓壇山字及三代彞器文識又學之仰其高古惟是之師而漢魏碑首印章亦時寓目下此者未嘗過而問焉今觀蘇君書規橅雖法李監而端徑方隱殊可珍傳信哉未易重古而忽今也跋蘇氏遺迹後洛陽漢魏晉唐舊都衣冠胄裔類多弗絶然園第轉徙或非其舊獨五代時蘇莒公禹圭之後保其故居巋焉尚存而子姓蟬聫以才德聞者娓娓不墜今顯道又能裒彚先世遺迹寶藏於家時出示士大夫以求標顯纍世美範尚不亡云大觀四年十一月望日書跋海陵志後海陵志在沈翰林括家沈慶厯中在金陵厨人以方石鎮肉視之有字刻乃此志也後為人借去不還遂亡所在此本今世殊難得然海陵乃齊世而沈云宋海陵王非也又云謝朓撰并書而志但云朓立耳然玄暉自以草隸名當時後人目以飛華滿目殘霞照人此志結字高雅必朓書也沈載此文於其書亦小異如溫文著性石本云者性嗣德方衰石本云方褰晚夜何長石本云曉夜當以石本為是政和元年正月十一日黃某長睿父書跋昌谷别集後右李賀逸詩凡五十二首案唐李公藩嘗綴賀歌詩為之敘未成間知賀有外兄與賀有筆硯舊召見託以搜采放失其人諾且請曰某盡記賀篇咏然黵改處多願得公所輯視之當為是正公喜并付之彌年絶迹復召詰之乃云某與賀中表自幼同處恨其倨忽常思報之今幸得公所藏并舊有者悉投匽中矣公大恚叱出之嗟慨良久故賀章什流傳者少今世行杜牧所敘賀歌詩篇才四卷耳此集所載豈非李藩所藏之一二乎政和元年三月望黃某長睿父從趙來叔借傳於河南右軍官舍跋溫公新壺格七國戲二書後新壺格七國戲二數此一字更考皆傳自溫公之孫樟文叔家圖本乃公手書頗有黵改處蓋初草定時本也政和元年六月十七日黃某長睿父書跋九詠後洛陽王晉玉好文愛古鑑裁殊高豫自為此文首以一通贈之雖子淵九懷無以遠追靈均逸步然休文郊居欣遇王筠真賞云跋祕閣第三卷法帖後此卷偽帖過半自庾翼後一帖首云已向季春等十七家皆一手書而韻俗筆弱濫厠諸名迹間始豫觀之但知其偽而未審其所從來及備員祕館因彚次祕閣川本作御府圖籍見一書函中盡此一手帖每卷題云倣書第若干此卷偽帖及他卷所有偽帖者皆在焉其餘法帖中不載者尚多並以澄心堂紙寫蓋南唐人聊爾取古人詞語自書之爾文真而字非故斯人者自目為倣書蓋但録其詞而已非臨摹也國初論次法帖時如王著輩不悟其非故但采其名雜載真帖間可勝歎哉今列此卷內一手偽帖於左庾翼後一帖沈嘉杜預後一帖親故王循劉超司馬攸劉瓌劉穆之王劭紀瞻王廞張翼陸雲山濤卞壼右十五家并庾翼杜預後一帖皆一手偽書庾亮庾翼前一帖杜預前一帖謝璠伯王徽之凝之操之渙之索靖王坦之謝莊王邃王恬王曇首孔琳之王僧虔右十四家并庾翼杜預前一帖皆真帖其餘盡一手偽書跋舊題破羌帖後川本無僕題此帖忽七寒暑光景如借一作昔正如詘伸臂頃耳政和辛卯嵗三月望長睿父跋張天覺書後張丞相書附川本無炎而附寒而去喜朝而惡暮者俗皆然方丞相謫漢東時通書牘接殷勤者潁川先輩一士而已乃知任安砥柱之心不獨稱于漢世政和元年七夕閩人黃某長睿父觀于洛陽張丞相書川本無豫兩任江右今謫官漢東獨足下兩有書來臧洪曰仁義豈有常蹈之為君子豈虛言哉十一月十七日商英白先輩足下跋洛陽九詠瞻上清後右瞻上清一首乃僕洛陽九詠之一也因此碑帙有五君杯柈文故書于帙右欲考杯柈所以者觀此可知也政和元年八月初吉黃某書跋法帖逸少書後玉局翁云希白作字自有江左風味故長沙法帖比淳化待詔所摹為勝世俗不知爭購祕閣本誤矣此逸少一卷尤妙僕謂此語故當亦有不然白摹書真似騎生馬不暇施鞚勒時有驟跌不害其妙處但拓字要當如陶華陽摹楊許書法乃佳耳此夲僕幼學者戲書其後政和元年九月夜書跋唐人書蘭亭詩後魏正始中務談玄勝及晉度江尤宗佛理故郭景純始合道家之言而韻之孫興公許玄度轉相祖尚又加以三世之辭而詩騷之體盡矣今山隂修褉諸賢詩體正爾然皆寄尚蕭遠軼迹塵外使人懷想深頃見晉人一帖云三日詩文既佳興趣高覽之增諸懷年少作各有心正謂此詩也是時與集者四十有一人今存者二十有六而已此卷雖唐人書故一作固自不凡亦可珍録政和元年十一月戊寅觀于右軍樾堂跋王大令授衣帖後右摹本王大令獻之授衣帖一卷七十二行有徐僧權陳惠辨押尾蓋梁御府法書也筆勢閎放實子敬書之合作者政和二年夏四月洛陽官舍裝跋寶篋經後乃王晉玉所蓄書凡五軸求豫跋尾此經結字殊類褚河南河南書盛行正觀永徽間故雖經生亦皆慕一作摹放閻令署家令銜而不著太子當是東宮經也跋華嚴經後唐史載武后作十有二文此卷復有證聖等字當時制字不特十二而已卷後初校再校皆祕書郎桓彥範署名蓋桓王嘗作此官本傳亦不載跋張長史帖後賀八清鑑風流千載人也沈吟此語恍若季真在目長史此帖不獨草聖可賞也跋摹逸少帖後世人摹書多作已態此卷拓右軍諸帖及拓歐輩跋字如人面目不同而翩翩各有佳趣深可珍愛冬初一帖乃虞永興書西上口等非晉人語也跋藏真書後水從銀漢落山繞畫屏新李太白詩也藏真書之可謂二寶謝康樂不得專美於前矣跋錢氏書後豫家吳中每聞故老言錢氏有國時賦厚役叢民不堪生今所營梵宮修楹穹極綿亘林壑它所興為率稱是宜若不能長守然武肅以唐乾寧二年乙卯嵗兼東西浙至我朝太平興國二年戊寅嵗獻地傳四將八十四年自五代來偏據之雄久有國者莫吳越若也詎非久假伯術畏義尊王以克永世者乎今觀所下二書每自抑損良可嘉也跋玉溪集後川本無政和壬辰嵗四月從河南王晉玉借東平吕氏本篇目頗弗倫因為緒正之二十九日乙卯裝于西都右軍巡官舍之樾堂是夕微風暑氣殊清長睿父書跋元和姓纂後川本無此富鄭公家書甲子嵗洛陽大水公第書無慮萬卷率漂沒放失市人時得而粥之鎮海節度印章猶存是書尚軼數卷以鄭公物姑致而藏之政和二年夏五月初吉雲林子書跋十七帖後右王逸少十七帖乃先唐石刻本今世間有二其一於卷尾有敕字及褚遂良解如意校定者人家或得之其一即此本也洛陽李邯鄲家所蓄舊本頗與此相近其餘世傳别本蓋南唐後主煜得唐賀知章臨寫本勒石置澄心堂者而本朝侍書王著又將勒石勢殊疏拙又有一版本亦似南唐刻者苐敘次顛舛文為十七帖而誤目為十八帖摹刻亦瘦弱失真獨敕字本及此卷本乃先唐所刻右軍筆法具存世殊艱得誠可喜也按張彥遠法書要録與余所著法帖刋誤論此帖本末頗完今並列于左方云政和二年五月初吉黃某書十七帖長丈有二尺貞觀中內本也凡百七行九百四十三字逸少草書中烜赫著名帖也文皇帝購二王書大王草有三千紙率以一丈二尺為卷取其迹以類相從綴成卷以貞觀兩字印印之褚河南監裝率多紫檀軸首白檀身紫羅褾織成帶開元皇帝又以開元兩字印印之跋尾列當時大臣名此帖號十七帖者以卷首有十七字故以名凡二王書後人亦有取帖一句語稍異者標為帖名大約多取卷首及帖首三兩字也右見張彥遠法書要録跋輞川圖後輞川二十境勝槩冠秦雍摩詰既居之畫之又與裴生詩之其畫與詩後得贊皇父子書之善並美具無以復加宜為後人寶玩摹傳永埀不刋然此地今遺址僅存園湖垞沜率為疇畝未有高士踵兹逸懷使人慨想深政和二年六月五日常山宋烜武陽黃某於河南官舍同觀跋陶淵明集後川本無政和二年嵗壬辰六月十四日己亥于洛都大福先寺挍竟時京西漕使張集仙晉父公易總運六路是日啓行與僚官送至白馬因遊福先黃某長睿父記跋漢冀州刺史王純碑後川本無是碑劉河清沔元中見遺猶乃祖龍閣所畜本也但有二通此其一云政和元年十一月於河南右軍官舍裝黃某長睿父以二年六月二十四日書跋漢太尉劉文饒碑後漢太尉劉文饒碑二故吏李謙等立一門生商苞等立一在今西都上東門外官道之北洛陽尉射圃中近世好事者亭以覆之目其亭為寶刻蓋以是碑為蔡中郎書故名焉二碑隂各有題名唐湖城公劉爽修碑記亦存焉豫官洛五年每過上東必裴徊碑下想文饒之高風玩中郎之妙楷與歐陽信本之觀索靖書碑坐卧不能去何以異云因令工椎拓二碑及隂文裝為三帙而時觀之政和二年七月初吉黃某長睿父書跋元和姓纂後川本無政和二年九月初吉於河南致卷首有鎮海軍節度使印蓋富韓公家舊本也會稽黃某書跋何水曹集後隋經籍志唐藝文志遜集皆八卷晉天福本但有詩兩卷今世傳本是也獨春明宋氏有舊本八卷特完因借傳之然少陵嘗引昏鴉接翅歸金粟褁搔頭等語而此集無有猶當有軼者集中若團團月隱洲輕燕逐風花遠岸平沙合連山遠霧浮岸花臨水發江燕繞檣飛遊魚上急瀨薄雲巖際宿等語子美皆采為己句但小異耳故曰能詩何水曹信非虛賞古人論詩但愛遜露滋寒塘草月映清淮流及夜雨滴空階曉燈暗離室為佳殊不知遜秀句若此者殊多如九日侍宴詩云疏樹翻高葉寒流聚細紋日斜迢遰宇風起嵯峨雲答高博士云幽蝶弄晚花清池映疏竹還度五洲云蕭散煙霞晚淒清江漢秋答庾郎云蛺蝶縈空戲日暮望江云水影漾長橋贈崔録事云河流繞岸清川平看鳥遠送行云江暗雨欲來浪白風初起庾子山輩有所不逮其警語尚多如早梅云枝橫却月觀花繞淩風臺銅爵妓云曲中相顧起日暮松柏聲句殊雄古而顏黃門謂其每病辛苦饒貧寒氣無乃太貶乎隂鏗風格流麗與孝穆子山相長雄乃沈宋近體之椎輪也政和二年九月十二日於河南右軍官舍挍黃某書跋王易簡玉仙傳後昔東晉楊君羲精思句容夢登蓬巒與洛廣休等五仙人遇其遊觀竒山峙潄濯滄流清語道家者流類能言之今觀玉仙傳後所書坐玉溪酌雲腴二夢與楊君事殊世冥符斯亦異矣於戲玉虛太漠之遊公其勉之政和二年十一月九日武陽黃某書新安周頴宜興蔣寧祖是日觀於道山之南榮跋穀梁傳後川本無柳子厚云穀梁子甚峻潔又云參之穀梁氏以厲其氣信哉政和二年十一月七日黃長睿書跋三蕭碑後此楷法自鍾元常後唯江左諸賢頗得之故蕭殿中書是碑古雅可喜然下至隋唐其法遂亡虞褚歐薛弗能逮也此可與識者論云政和癸巳嵗四月二十七日黃某長睿父書跋顧誡奢書呂肅公碑後少陵送顧八分文學詩云中郎石經後八分蓋憔悴顧侯運爐錘筆力破餘地昔在開元中韓蔡同贔屓玄宗妙其書是以數子至此詩蓋謂誡奢也觀其遺迹乃知子美弗虛稱之碑首倒薤亦自竒古不獨八分可賞云政和三年六月丁丑黃某長睿跋楊少師詩後少師此詩本題于西都長壽寺華嚴院東壁僕近嵗官洛因覽宋次道三川官下記知之亟往觀焉墨蹤石本皆不復存院僧云三十年前有士人寓是院數嵗及徙居他郡壁與石亦弗之見豈非好事者負之而趨乎今忽得此本殊可欣也政和三年六月二十八日黃某書跋黃庭經後黃庭世有數本或響拓或刋刻皆正書蓋六朝及唐人轉相摹放所以不同此卷臨學殊工字勢源放歐率更固自合作殊可佳歎世傳黃庭真帖為逸少書僕嘗考之非也按陶隱居真誥翼真撿論上清真經始末云晉哀帝興寧二年南嶽魏夫人所授弟子司徒公府長史真誥作舍人楊君使作隸字寫出以傳護軍長史許君及子上計掾掾以付子黃民民以傳孔默後為王興先竊寫之始濟浙江遇風飄淪以真誥挍惟有黃庭一篇得存蓋此經也僕按甲子嵗逸少以晉穆帝升平五年卒是年嵗在辛酉後二年即哀帝興寧二年始降黃庭于世安得逸少預書之又按梁虞和論書表云山隂曇􅙓村養鵝道士謂羲之曰久欲寫河上公老子縑素早辦而無人能書府君若能自屈書道德經兩章便合羣以奉於是羲之便停半日為寫畢携鵝去而晉書本傳亦著道士云為寫道德經當舉羣相贈耳初未嘗言寫黃庭也以二書考之則黃庭非逸少書無疑然陶隱居與梁武帝啓云逸少有名之迹不過數首黃庭勸進告誓等不審猶有存否蓋此啓在著真誥前故未之考證耳至唐張懷瓘作書估云樂毅黃庭但得幾篇即為國寶遂誤以為逸少書李太白承之作詩山隂道士如相見應寫黃庭換白鵝苟欲隨之耳初未嘗考之而韓退之苐云數紙尚可博白鵝而不云黃庭豈非覺其謬歟然今此帖始見於梁代蓋晉興寧以後或宋齊人書也僕頃在洛見承直郎李鵬舉家畜此帖一卷乃唐褚令摹單郭未填筆勢精善乃錢思公家本號玉軸黃庭中有五行為周越摹換之今歸御府矣世所傳本無出其右今題此卷聊爾論之政和三年九月望日黃某題傅墨卿同觀跋孔耽碑後是碑在亳州永城縣廨中僕向見滕同舍言其目復於上官仲雍知其所在政和癸巳嵗十月十九日余國器聖求自永城寄至詞筆皆古雅因以章草書其文一通以便覽觀云是夜鼓二於清平坊第書長睿父記跋袁仙夫帖後川本無袁液仙夫貴戚子姓而好學趣尚不凡近殊可喜意其必大而年未三十不幸死矣深可嗟惜豫在洛與之同僚投分素深覩其遺迹不覺潸然政和三年十月十九夜長睿書跋師春書後杜預記汲冢書有云别一卷純集疏左氏傳卜筮事上下次第及其文義皆與左傳同名曰師春師春似是鈔集人名也僕近在館中求師春觀之乃與杜説全異杜云純集左傳卜筮事而此乃記諸國世次及三十八公嵗星所在並律呂諡法等末乃書易象變卦又不專載左氏卜筮繇是知其非元凱所見師春也然杜記汲冢他書中有易隂陽説而無彖繫又有紀年三代并晉魏事疑今師春蓋後人雜鈔冢書紀年等篇耳然杜云紀年起自夏商而此自唐虞以降皆録之杜云紀年皆三代王事無諸國别而此皆有諸國杜云紀年特記晉國起殤叔次文侯昭侯而此記晉國世次自唐叔始不特起于殤叔則三者又與紀年異矣及觀其書嵗星事有征南洞曉隂陽之語乃知此書亦西晉人集録而未必盡出汲冢也然多古事可備考證固不可廢云政和癸巳嵗十一月初吉借睢陽滕子濟本傳會稽黃某長睿父書跋高彥休闕史後政和三年秋於東都清平坊傳此書敘云甲辰嵗編次蓋唐僖宗中和四年也而其間有已書僖號者或後人追改之彥休敘事頗可觀但過為緣飾殊有銑溪虬戶體唐徐彥伯為文多變易求新以鳳閣為鶠閣以龍門為虬户以金谷為銑溪云云後進效之謂之澀體語見朝野僉載此其贅云次年三月七日再閲一過黃某書跋何璧書後是書字字應二王橅矩何璧者不知何物人草法之工如是然所書月儀等帖辭太淺俚蓋唐中葉後人所為觀者取其書略其語可也政和四年四月望黃某長睿父題跋假太常語録後川本無此卷本是廬陵官下記上篇亦假太常作政和四年四月以祕閣本挍長睿書題集逸少書聖教序後書苑云唐文皇製聖教序時都城諸釋諉𢎞福寺懷仁集右軍行書勒石絫年方就逸少劇迹咸萃其中今觀碑中字與右軍遺帖所有者纎微克肖書苑之説信然然近世翰林侍書輩多學此碑學弗能至了無高韻因自目其書為院體由唐吳通微昆弟已有斯目故今士大夫玩此者少然學弗至者自俗耳碑中字未嘗俗也非深于書者不足以語此政和四年四月二十四日黃某長睿父題跋滕子濟所藏唐人出遊圖宋之問王維李白高適史白岑參晉人深于畫者得意忘象其形模位置有不可以常法觀者顧陸王吳之迹時有若此如雪與蕉同景桃李與芙蓉並秀或手大于面或車闊于門使俗工睨之未免隨變安于拙目故九方臯之相馬略其玄黃取其駔雋惟真賞者獨知之此卷寫唐人出遊狀據其名題或有弗同時者而揚鑣並驅睇眄相語豈亦于世得意忘象者乎求畫者主名弗可知要非俗手作也政和甲午嵗四月二十四日觀于道山東序跋王大令帖後張懷瓘云子敬草書幼師父而後法張芝僕謂獻之行草亦然模矩雖出于逸少而筆氣飄飄已面元常庭域矣故自謂與尊故當不同人那得知非夸辭也觀此帖縱軼若此而唐文皇目以拘攣餓隸無乃大貶乎政和甲午嵗八月三日夜雲林子黃某觀跋張閎道草書後王簡穆以書名齊世竇臮謂其密緻豐富神高氣全今遺迹可見者有劉伯寵謝憲王琰三帖尚傳其論書一篇具載本傳意當時必自書之惜哉今亡矣張閎道遊心翰墨追為之書殊可喜也僕見前輩效鍾王書自羊薄以還類多規規然雖精而弗肆至張融自謂不恨己無二王法乃恨二王無己法乃知一藝之至亦當克自植立融之言不為過也今觀閎道真草亦矯然自作一家風範宜諸賢歎賞之多云政和四年十二月庚午黃某觀跋四皓碑後三輔舊事云漢惠帝為四皓作碑於其所隱處此神坐及祚几豈亦當時所立邪政和五年嵗乙未正月十五夕再書同觀者次明弟跋細字華嚴經後東漢師宜官善書大則徑丈一字細則能方寸千言書是經者亦以尺紙作七萬字殆得宜官法也晉衛巨山論書云其大徑尋細不容髮迫而察之心亂目眩竒姿譎詭不可勝原研桑所不能計宰賜所不能言僕于此經亦云政和五年二月甲寅雲林子黃長睿父書跋陶華陽書後陶隱居書故自入流其在華陽得楊許三真君真迹最多而學之故蕭遠淡雅若其為人今金陵有許長史舊館壇碑最先一行乃隱居書又世有畫版帖四十三字與碑字筆勢同今觀其為楊瓊瑶作奏章藁與前二書雖真行不同要非異手作也袁昂論書以隱居若吳興小兒形狀未成長而骨體甚峭快今審其疏比之鍾王為未成就然神韻間曠那可以峭快目之獨竇臮謂其高爽自然逸軌奮舉頗近實云政和乙未嵗二月二十二日黃某長睿觀跋盤線圖後右盤線圗唐王睿敘而傳之以為唐諸王之遺迹然豫頃于吳中見劉季孫景文家有此畫一卷古題云宋武帝東征劉毅道廬山隱士宗炳獻一筆畫一百事帝賜以犀柄麈尾與此本大同小異所畫物像存者亦五十餘種匠意簡古筆勢若出一手然後知是畫非唐人能為王睿以為唐諸王畫誤矣政和五年春於東都清平坊手摹一通黃某長睿父題跋趙韓王書後蕭相國守關中因鮑生説遣子孫昆弟能勝兵者悉詣軍所漢王大説當楚漢相距京索間高帝方暴衣露蓋有疑蕭公心故欣其此舉若夫我藝祖太宗則不然聖度𢎞廓任賢弗疑佐命之臣類以功名寵祿始終而忠獻王梁楹丕基為國宗臣雍熙中四方底定久矣承平之際偃息近藩豈復見疑而因婦子取信以自明哉其遣夫人朝京師賀誕節蓋忠順之至誠見于禮非謂位高多懼而然也至其家問中指撝川夲作規矩審細字畫謹嚴又以見王之克勤小物如此政和五年三月二十一日黃某謹書跋江南藏真書後唐慤通叟所寶求豫題跋頃見江南後主錯金書題藏真書千字曰戴叔倫詩云詭形怪狀翻合宜誠哉是言今見藏真書自敘乃有叔倫全章此卷真迹豈亦江南集賢所畜書乎跋龍眠九歌圖後楚詞九歌凡十一篇九神而梁昭明取六章載於文選故是圖貝闕珠宮乘黿逐魚亦可施於繪素後人或能補之當盡靈均之清致也跋劉向列仙傳後司馬相如云列仙之儒居山澤間列仙之名當始此傳云劉向作而漢書向所序六十七篇但有新序説苑列女傳等而無此書又敘事并贊不類向文恐非其筆然事詳語約辭旨明潤疑東京文也跋索靖章草後索將軍章草下筆妙古今七月二十六日帖月儀急就篇此著名書也春蘭秋菊各不同而花花自有佳趣跋王晉玉所藏韋鶠馬圖後張彥遠謂鶠善畫川原小馬牛羊今晉玉所藏本皆沛艾二字見子虛賦余謂杜子詠鶠秃筆掃驊騮騏驎出東壁即不特善小駟而已蓋曹將軍畫馬神勝形韓丞畫馬形勝神鶠從容二人間苐筆格差不及耳昔豫見嘶囓二馬小圖于江左人家筆勢駸駸亦若此此本鶠畫不疑四月八日跋王方慶押尾後王方慶雖系出琅邪然自褒至方慶四世封石泉今寶章押尾乃云琅邪縣男不解其義或方慶嘗改封而史失其傳邪長睿父書跋西京雜記後此書中事皆劉歆所記葛稚川采之以補班史之缺耳其稱余者皆歆本語中有歆所記草木名而假柯古作酉陽書乃云稚川就上林令虞淵得朝臣所上草木名非也蓋假誤以歆自稱余為稚川耳又按晉史葛未嘗至長安而晉官但有華林令而無上林令其非稚川決也柯古博洽時罕儔猶舛謬如此長睿題跋步輦圖後右晉明帝步輦圖南齊謝赫畫雖經傳摹意象高古但所畫輦上設一几旁施雙扛殊無輦制余按輦自漢以來始為人君之乘魏晉小出則御之過江遂亡制度太元中謝安率意造焉及破苻秦獲京都舊輦形制無差時人服其精記則明帝時輦無制度宜矣又東晉時􅀈袍尚未盛行而此圖侍臣服之豈當時五胡據中原江左已襲其風歟卷首題云廣順癸丑季夏狂生摹嘗見陶穀家逸少帖後有顯德初酒狂題字與此正同廣順顯德相接當是此人苐未能名之耳跋絳帖子敬書後告薑秀還二帖及得奈如告至晚或成傷皆子敬書廣袤肥瘦後先不同乃爾豈稚老結字固自異乎抑具諸家法别作體乎長睿父觀跋法書五帖後同松來二妹三帖王氏書蚊幬一帖梁陳間人書損惠野禽一雙一帖近世偽作殊惡跋周陽侯家甗文後此西漢時器在文潞公家字畫細淺難椎拓今以拓書紙帖器銘上就摹之殊不失真也跋王晉玉所藏桓宣武畫像後竇蒙南齊畫目中有桓溫像一卷上之上此卷後題云上品上正此畫也但長康乃晉陵無錫人此云譙國人不知何謂袁倩毛惠遠宋人沈熾文姚懷珍梁人當時祕府書畫多此諸人題但此卷以袁毛姚題于唐褚令後恐誤録也跋陶徵士集後淵明讀書不求甚解而僕丹鉛事點勘勤勤不去手良自可嗤也跋真誥衆靈教戒條後此下方圍諸條皆與佛四十二章經同恐後人所附益非楊許書跋紫陽先生李含光碑後紫陽碑乃張從申書李陽冰題歐文忠不喜從申書集古録屢言之殊不知從申乃效子敬書頗有東晉風尚唐人知書者多故見重于世今人反此歐陽公初不間法書則從申之迹見棄宜矣跋定本古器圖後川本初政和五年十一月十一日于山陽以張丈人家本挍并補所乏黃某長睿父書跋漢舊儀等書後川本無此書帙中漢舊儀典儀官儀及詩譜並劉邍父公食大夫義至寓辨凡十三篇中有先大門會稽公手書自增諫官而下十一篇并李外郎一詩皆先君手書於戲子子孫孫其永寶讀之政和五年十一月十一日某謹題跋唐人書後此十餘字在祕閣唐本藝文類聚內一卷尾蓋貞元中人題因響拓之政和五年十一月甲午跋開弟所藏張從申愼律師碑後張從申書其原出于王大令筆意與李北海同科故名重一時書苑云從申結字縝密近古未有弟從師從義從約並工書皆得右軍風規時人謂之四龍書賦云張氏四龍名揚海內厥有季弟功夫少對右軍風規下筆斯在季謂從申也又云從申近古所無恨於聞見不多右軍之外一步不窺豫觀從申雖學右軍其原出於大令筆意與李北海同科名重一時宜不虛得但所短者抑揚低昂太過又真不及行耳然唐人而有晉韻殊可佳尚近世歐陽文忠為集古録而雅不愛從申書故此碑見棄而特處其篆首至其書王師乾碑以見稱于秦玠故聊存焉信乎真賞之難值也既云從申有弟三人又云季謂從申不可曉跋洛陽所得杜少陵詩後政和二年夏在洛陽與法曹趙來叔因撿挍職事同出上陽門於道北古精舍中避暑于法堂壁間弊篋中得此帙所録杜子美詩頗與今行槧本小異如忍對江山麗印本對乃作待雅量涵高遠印本涵乃作極當以此為正若是者尚多豫方欲借之寺僧因以見與遂持歸挍所藏本是正頗多但偶忘其寺名耳六年二月十一日舟中偶翻舊書見之因題得之所自云山陽還丹陽是夕宿揚州郭外長睿父題跋洛陽伽藍記後川本無大觀二年三月二日緣檄行河隂縣城隄於北禪寺初挍一過四月七日于東齋再挍竟政和六年二月十二日丙戌于揚州南門舟中讀一過大觀戊子嵗寫此書時題字俯仰八載矣長睿父書跋宗室爵竹畫軸後張彥遠論畫以為上古意簡而迹淡近代煥爛而求全故以氣韻生動為先經營位置為下豫嘗考其語以謂丹青猶文也謝康樂則如芙蓉出水自然可愛顏光祿則如鋪錦列繡雕繢滿眼自然之與雕繢蓋不翅霄壤今觀唐人遺迹薛稷以羽毛聞然格遠而筆弱蕭悅以竹聞然筆徑而乏韻二子之畫但專萃精于一猶不得其全况梅竹集羽並秀筆端趣間韻遠若師純公之此畫真可尚己意其移是意于文則謝客之吐言天拔詎足多慕政和六年五月二十一日會稽黃某觀跋愼漢公所藏相鶴經後按隋經籍志唐藝文志相鶴經皆一卷今完書逸矣特馬惣意林及李善注鮑照舞鶴賦鈔出大略今真靖陳尊師所書即此也而流俗誤録著故相國舒王集中且多舛午今此本既精善又筆勢婉雅有昔賢風槩殊可珍也政和六年秋于山陽從愼漢公借覽并觀漢公題後行間茂密徑古可喜此經蓋真靖頃遺漢公者是時漢公甫八嵗耳真靖已稱其喜學鍾王遺法以神童目之因贈此以結忘年友宜其書之工如此漢公學行高士林間又博貫蘂經壺史多與方外士遊不特其書可賞云九月十六日雲林子黃某長睿父書跋玉笥山清虛館碑後清虛館者梁天監中京兆杜曇永於廬陵玉笥山建之以栖遁而蕭侍中子雲景喬裔孫律守虔州重刻兹記而書其後引玉笥山實録以為景喬自嶺南使還登此山師曇永而道成上帝賜之玉册以為元洲長史治郁木福庭舉族八十二人皆仙去又於碑書景喬之官乃曰黃門侍郎太子司徒左長史按梁初景喬自太子舍人移丹陽郡丞出為臨川內史還除散騎常侍侍中國子祭酒又出為東陽太守太清元年復為侍中及祭酒三年宮城失守奔晉陵餧卒于顯雲寺僧房年六十有三與玉笥山録所載乖異亦猶漢史書淮南王安自殺而仙史謂其盡室上賔者同也然方外之事固不可以常理測景喬仙去之事道家書載之甚著唐世亦有遇之于兹山者苐恐其餧卒晉陵道家所謂解化猶託劍驗火之類也至于山録稱其嘗使嶺南及為黃門侍郎太子司徒長史則誤蓋考之于傳景喬苐嘗為太子舍人為侍中為臨川為東陽未始位黃門及長史並使嶺表也然豫嘗見子雲啓事梁武稱侍中南徐州刺史臣子雲而傳亦不書其刺南徐則史家容有舛漏但太子官屬初無長史乃見碑所題之謬也景喬文詞雖六朝駢儷體故自清靡可喜要不失為佳文至律所刻玉笥上清宮碑題云杜曇永撰則詞格淺俚與景喬所製不侔然亦非當時語殆唐末五代人所為假託杜君耳清虛碑但云杜君為豫章王左常侍耳而上清碑末題云天監十五年立至題杜君之官則云禮部侍郎翰林學士其不稽古甚矣若律者其陋至此得無愧厥祖乎獨其能傳景喬之文於石及立祠室為可取又所題碑後詞致一作至凡近弗倫豫頗為刪易並録二碑及南史景喬傳並置右方使觀者有考焉苐律重刻清虛碑字甚惡故但録其文耳古樓觀之觀乃謂之觀而道家居皆目以館若宋崇虛館梁朱陽館為陶隱居置之類甚衆至近古乃以館為觀蓋亦取仙人樓居之義因辨此碑聊識于後政和六年嵗在丙申九月二十一日雲林子黃某長睿父書跋假柯古靖居寺碑後假柯古博綜墳素著書倬越可喜嘗與張希復輩敖上都諸寺麗事為令以假該悉內典請其獨徵皆事新對切今觀靖居碑亦晝上人以其博涉三學故諉録寺讚也文傷太擁釀要為不凡雖竒澀不至若樊紹述絳之甚然亦軋軋難句矣碑大中中作而左金吾長史顏稷所書殊有楷法唐中葉以後書道下衰之際故一作固弗多得云政和六年十月十八日黃某長睿父于楚栖鳳堂書跋章草彌陀經後川本無黃某伏遇先大門大資政特進遠忌之辰謹自恭書佛説阿彌陀經一卷仰申追報伏願乘此尊經妙力超生極樂淨方一切有情並同今願政和六年九月二十三日謹題跋所書十七帖後川本無逸少十七帖書中龍也張彥遠以為王草中烜一作炟赫著名帖信然僕得善本每喜臨學此卷雖不足以追蹤遐軌故自有合作者信筆偶書不暇擇紙尚不愧裴行儉云黃長睿父題政和六年嵗在丙申十月十八日於山陽栖鳳堂書跋古文韻後政和六年冬以夏鄭公四聲集古韻及宗室克繼所廣本二書參寫并益以三代鍾彝鼎器欵識及周鼓秦碑古文古印章碑首並諸字書所有合古者益之比舊本殊廣以備遺忘作隸字書者多有訛舛亦姑藏之以廣異聞觀者其自辨之十一月丙申于山陽栖鳳堂親寫十二月丙戌於廣陵瓜步舟中記之雲林子書跋黃庭內景經後東晉興寧二年太嵗甲子上真司命紫虛元君南嶽魏夫人降丹陽之句曲山以上清諸真經授弟子琅琊王公府舍人楊君使作隸書出以傳護軍長史許君父子魏傳青籙文所謂起安啓年經乃始傳得道之子當修玉文黃庭內景乃其一也亦名琴心文又名太帝金書又名東華玉篇自楊許仙去大傳于世而積載既久轉寫多誤如以尊為前以通為遍以胥為骨以飛為緋此例甚衆惟華陽登真隱訣所載乃楊許舊本可以據依今參讐衆本而以隱訣是正庶幾不失真語云政和七年嵗在丁酉正月丙辰雲林子黃某於丹陽東齋書跋楊少師書迹年譜後川本無政和七年二月十七日因觀景度諸帖聊次其嵗月先後及記其書迹所在以備考證云武陽黃某書跋鍾繇賀捷表後歐陽文忠集古録謂世傳鍾繇賀捷表稱建安二十四年閏月以問孫思恭思恭以為閏十月良是但云據吳志權閏十月才征羽至十二月獲之正月乃傳羽首至洛陽則鍾繇安得于閏十月先賀捷也又再題云建安二十四年冬曹公軍于靡陂而曹仁等破羽後未嘗出征履險冒寒之後又古人箋啓不書年此二事可疑今按魏志是年十月操自漢中還孫權上書以討羽自效王自洛陽南征羽未至徐晃攻羽破之羽走王軍靡陂至正月始還洛陽孫權取首至吳志稱閏月權征羽十二月獲之按志稱十月自洛陽南征羽至來年正月始還則正當寒際故云履險冒寒也操未至而徐晃已攻羽破之羽走則此表所謂征南將軍與徐晃並力而羽已被矢表中作刃者正是也則此表與魏志所書正合非偽也蓋此表特賀閏月徐晃之破羽非謂賀十二月權之殺羽也因此致疑又按古人箋啓多不用年至表奏則與箋啓異其稱年無疑又魏志是年九月相國鍾繇免故此表于閏十月但稱東武亭侯耳皆與史合其曰南蕃者蕃音皮謂南皮郡也東武南皮之屬故并著之今人讀為蕃鎮之蕃誤矣此表世傳本有二字雖大小殊而其體小異不同蓋後人臨摹之變耳政和七年五月十三日同前此篇與前小異故兩存之今考魏志是年十月曹操自漢中還洛陽孫權上書乞討羽自效閏月王乃南征未至徐晃攻羽破走之王軍靡陂至正月始還而權傳羽首至洛吳志稱閏月權征羽十二月獲之按操以閏十月南征以正月還洛往復正當寒際此繇表所謂踐險冒寒正是也操未至而閏月中徐晃已破羽走之此繇表所謂征南將軍與徐晃并力而羽已被刃者正是也征南將軍即權耳其曰刃者謂羽為晃破雖未即殺之而羽已被創矣至十二月權始追獲之蓋徐晃之破羽在閏十月孫權之殺羽在十二月今繇以閏十月上操表乃賀是月之破羽非賀十二月之破羽也則此表與史書正合非偽明甚又按古人箋啓多不用年至表奏則用年者有之若劉琨上晉元帝表稱建興元年是也文忠謂古人表不書年者其未之考乎又魏志是年九月相國鍾繇免故閏十月表但稱東武亭侯耳皆與史合其曰南蕃者蕃音皮謂南蕃郡也東武南蕃之屬故并著之或讀為蕃鎮之蕃誤矣跋章草雞林紙卷後政和丁酉嵗五月二十一日於丹陽城南第暴舊書得此雞林小紙一卷已為人以鄭衛辭書盈軸矣竊矜其遠物而所書未稱顧紙背尚可作字因以索靖體書章草急就一卷藏于家運筆結字頗合作庶幾顏文忠牒背書囊舊事川本無此二字云紙凡十二枚共二千一百五十字武陽黃某長睿父書跋草書洛神賦後此賦草書世傳王大令書然結體殊不類獻之而頗似智永疑其遺迹也至洛神小楷則子敬書無疑矣世以小王好書此賦故凡有洛神書夲皆歸之子敬猶東漢諸碑流俗多以為蔡雍書豈盡中郎筆迹哉要當鑒以心目而弗信耳傳為佳政和七年六月六日黃某長孺父書跋潯陽石本頭眩方後治頭眩方世傳王逸少書今絳州石帖中有此帖甚著于世政和丁酉嵗六月七日襄州教授丹陽陳君孝友見過云崇寧間彭諫議君時守潯陽役兵于山間斸石得一大石中空內有小石若碑版然視之有刻文即此碑也大石未破時堅完無際不解緣何中有此碑殊可異也陳之父時亦官潯陽得此拓本陳因以見遺視之比絳帖差縱逸結字互有工拙要之此本當在絳刻前但不知何世所刻按逸少嘗在江州豈晉以後好事者因移寫于斯石歟意其薶沒既久土或變石故是刻藏于石間理不足怪世或以此帖為虞永興書恐未必然或虞嘗臨此書故微翻其體今世所有魏晉諸帖中往往唐人臨橅爾洪纖拘放結體不一真賞者自能辨之是月九日黃某于丹陽東齋書跋王子敬帖後袁昂論子敬書以為河朔少年充恱沓拖此書結體正爾而晉書謂其瘦如隆冬枯木非篤論也此帖摹傳殊逼真與官帖所録有間矣跋楞嚴白繖蓋後政和丁酉嵗六月於南徐州城南宅傳延慶精舍釋祖一祝本自書梵文二十二日于廣陵舟中書黃某題跋北齊勘書圖後僕頃嵗嘗見此圖别本雖未見一作審畫者主名特觀其人物衣冠華虜相雜意後魏北齊間人作及在洛見王氏本題云北齊勘書圖又見宋公次道書始知為楊子華畫其所寫人如邢子才魏收輩豈在其間乎宜其模矩乃爾今觀此本益知北土人物明甚則知子華之迹為無疑唐閻令稱子華自象人以來曲盡其妙簡易標美多不可減少不可踰今詳其迹信然苐他本尚餘兩拓有啓軸隱几而仰觀者有執卷搘如意而沈思者數輩蓋當時畫此弗但一通也李正文上字本太祖諱資暇録謂茶托始于唐崔寧今北齊畫圖已有之則知未必始自唐世亦猶蕭梁已有紫囊盛笏而唐史始于張九齡者同也觀者宜審定之政和丁酉嵗八月五日武陽黃某長孺父于楚州衮華堂觀跋案樂圖後周昉丹青始以道佛像及寫真知名故畫章敬寺壁圖趙縱像畫史稱之今洛城南宮有楊真人降真及瓊樓仙人等畫蓋妙絶一時今世但傳其子女而已是可歎也此圖尤有思致而設色濃淡得顧陸舊法故可珍愛跋織錦回文圖後蘇蕙織錦回文詩所傳舊矣故少常沈公復傳其畫繇是若蘭之才益著然其詩回旋書之讀者惟曉外繞七言至其中方則漫弗可考矣若沈公之博亦謂辭句脫略讀不成文殊不知此詩織成本五色相宣因以别三四五七言之異後人流傳不復施采故迷其句讀非辭句之脫略也政和初豫在洛陽于居士王晉玉許得唐程士南效此詩並申諴之釋而後曉然是詩之初不舛脫蓋沈公未嘗見此本耳然申諴所釋但依士南之設色其七言數火其色反黃四言數金其色反緑于五行為弗類意蘇氏詩圖之色為不爾今因冠詩于畫遂别而正之三四五七言之詩各隨其行而為之色觀者見其色則詩之言數可知已至于士南之文既有釋者則賦采自從其舊而并録于卷首云國初錢鎮州惟治嘗有寶子垂綬連環之詩亦錦文之遺範而世罕傳故聊附卷左以資書雋言鯖之餘味焉七年九月二十七日會稽黃某長孺父于山陽衮華堂書跋錢鎮州回文後錢鎮州詩雖未脫五季餘韻然回旋讀之故自娓娓可觀題者多云寶子弗知何物以豫考之乃迦葉之香爐上有金華華內乃有金臺即臺為寶子則知寶子乃香爐耳亦可為此詩證但圜若重規然豈漢丁緩被中之製乎跋張曲江集後川本無讜言如在高風可仰政和丁酉十月初吉楚衮華堂觀跋陳碧虛所書相鶴經後自秦易篆為佐𨽻至漢世去古未遠當時正隸體尚有篆籀意象厥後魏鍾元常及士季晉王世將逸少子敬作小楷法皆出于遷就漢隸運筆結體既圜徑淡雅字率扁而弗撱今傳世者若鍾書力命表尚書宣示世將上晉元帝二表逸少曹娥帖大令洛神帖雖經摹拓而古隸典刑具在至江左六朝若謝宣城蕭挹輩雖不以書名世至其小楷若齊海陵王志開善寺碑猶有鍾王遺範至陳隋間正書結字漸方唐初猶爾獨歐陽率更虞永興易方為長以就姿媚後人競效之遽不及二人遠甚而鍾王楷法彌遠矣隋世善書者多其間丁道護者不今不古遒媚有法今觀碧虛子陳君小楷殊得道護筆勢亦可謂有意于古者也案隋經籍志唐藝文志相鶴經皆一卷今全書軼矣特馬惣意林及李善注鮑照舞鶴賦鈔出大略今此本是矣而流俗誤録著王丞相集中且多舛午今本雖非全篇然比世傳他本最精善真可垂永云政和七年十月十一日於山陽衮華堂觀武陽黃長睿父書跋吳道玄地獄變相圖後吳道玄作此畫視今寺剎所圖殊弗同了無刀林沸鑊牛頭阿旁之像而變狀隂慘使觀者腋汗毛聳不寒而栗因之遷善遠罪者衆矣孰謂丹青為末技歟政和七年嵗丁酉十二月二日武陽黃某長孺父書同觀者外弟鄱陽張熹子昭建安翁招士修時寓楚之衮華堂跋古文書武成篇後劉邍父云此書簡册錯亂兼有亡逸今次定之如右豫小子其承厥志以下武王之誥未終當有百工受命之語計脫五六簡矣然後以乃偃武修文云跋唐人所摹十七帖後豫嘗見畢文將叔云家有唐初人所摹此帖來禽等四物外又有密蒙華一種先丞相文簡公答王黃門寄密蒙華詩云多病眼昏書懶讀煩君遠寄密蒙華愁無內史詞兼筆為寫真方到海涯蓋謂此也然余按今諸本並無此一種而法書要録十七帖亦不載此不知何緣畢氏本有之但未嘗見此帖無從知其真偽姑記于此以俟後觀云跋寶王論後夫子曰立則見其參於前也在輿則見其倚於衡也夫然後行漢書曰坐則見堯於墻食則見堯於羮道之不可須臾離也如此雖然此特域中之道耳首楞嚴經云若諸衆生憶佛念佛見前當來必定見佛不假方便自得心開豫謂修念佛三昧亦當如參前倚衡與夫見堯之義行住坐卧皆應憶念何患不見佛哉此真出世成道之要津也修是三昧者當以安養為期蓋彌陀願力以接引羣生為務大光普照攝取不舍凡存念者盡得往生其利溥哉豈特見堯於牆於羮但虛想乎政和七年十一月三日於符離境舟中因觀唐釋飛錫念佛寶王論因思吾夫子與漢史之言與佛若合符契乃紀於此帙冀時觀之以自䇿焉凡見聞者其亦勉諸黃某長孺謹書跋施真人集後右唐施肩吾集其詩無慮五百篇有肩吾自敘冠焉而陳倩所敘才六十二篇蓋未嘗見完書也今合為一集以雜筆三篇附于後肩吾隱豫章西山莫知其終江右人至今傳以為仙觀其三住銘論氣神形之指甚微真得道者之言與其詩格韻雖若淺切川本作近然時有過絶人語頗可觀覽政和丁酉嵗十一月十二日武陽黃某長孺父于京路舟中校之跋滕子濟所藏貘圖後按山海經圖南方山谷中有獸曰貘象鼻犀目牛尾虎足人寢其皮辟溫圖其形辟邪嗜銅鐡弗食他物昔白樂天嘗作小屏衛首據此像圖而贊之載于集中今觀此畫夷考其形與山海圖樂天集所載同豈非白屏畫迹之遺笵乎政和丁酉嵗十二月十日武陽黃某長孺觀于子濟之書齋跋米元章摹平章帖後右米襄陽芾摹逸少平章帖筆趣翩翩固自佳但肆筆拓放殊不填郭非古也昔人拓書欲如水月鏡像者故應郭填乃造微耳跋李西臺書後西臺本學王大令書而拘攣若此猶韓非之學黃老李斯之師荀卿也然徐觀筆勢尚有先賢風氣固自佳跋所書詩軸後張子昭弟雅善法書以此卷蘄僕諸體書聊書頃所為歌詩數詞為作正行草章字四種屬疾小佳殊乏劣深愧大令之合作也然筆勢頗傳魏晉餘韻庶幾真賞之擊節云子昭復欲漢碑字及鍾鼎古文二種因附卷末蓋曲終奏雅之義也跋唐建中告後此告建中三年八月二十九日其後具列中書省官所謂太尉兼中書令臣在使院者朱泚也中書侍郎同平章事臣張使者張鎰也知制誥臣劉太宣宣奉行者劉太真弟也蓋前一年泚節度涇原還鎮鳳翔加中令拜太尉故云在使院然三年四月鎰已罷相出帥歧而猶帶平章事又當時唯盧把在門下而中書闕真相故是年八月尚具鎰銜而注使字也泚鎰皆在外中書官宣奉行者獨太宣也以鎰之忠藎而棄外把之姦而當國泚之隂賊而位三公德宗建中之政可知矣是告所存惟尺素耳興衰之迹固已具見後之覽者寧不慨然黃長睿觀跋郭忠恕所摹按樂圖後開元按樂圖周昉畫是本蓋國初郭忠恕所摹中有髯者乃恕先自寫真也黃某書跋孔穎逹碑後孔祭酒碑世傳虞永興書非也沖遠之沒乃後伯施十年豈非當時學永興法者書耶然筆勢遒媚亦自可珍跋瘞鶴銘後朱方鶴銘陶貞白書在焦山下石頑難刋且為水泐故字無鋒穎若掘筆書昧者從而斆之深可一笑跋瘞鶴銘後邵資政考次銘文載在卷後右瘞鶴銘資政邵公亢嘗就焦山下缺石考次其文如左其不可知者闕之故差可讀然文首尾似粗可見雖文全亦止此百餘字爾而歐陽文忠集古録謂好事者往往只得數字唯余所得六百餘字獨為多矣蓋印書者傳訛誤以十為百當時所得蓋六十餘字故云比數本為多此銘相傳為王右軍書故蘇舜欽子美詩云山隂不見換鵝經京口新傳瘞鶴銘文忠以為不類王法而類顏魯公又疑是顧况云道號同又疑是王瓚僕今審定文格字法殊類陶𢎞景𢎞景自稱華陽隱居今曰真逸者豈其别號歟又其著真誥但云己卯嵗而不著年名其他書亦爾今此銘壬辰嵗甲午嵗亦不書年名此又可證云壬辰者梁天監十一年也甲午者十三年也按隱居天監七年東遊海嶽權駐會稽永嘉十一年始還茅山十四年乙未嵗其弟子周子良仙去為之作傳即十一十三年正在華陽矣此銘後又有題丹陽尉山隂宰數字及唐王瓚詩字畫亦頗似瘞鶴銘但筆勢差弱當是效陶書故題于石側也或以銘即瓚書誤矣王逸少以晉惠帝大安二年癸亥嵗生年五十九至穆帝升平五年辛酉嵗卒則成帝咸和九年甲午嵗逸少方年三十二至永和七年辛亥嵗年四十九始去會稽而間居則不應三十二年已自稱真逸也又未官于朝及間居時不在華陽以是考之此銘決非右軍也審矣跋桓宣武傳後此顧愷之畫溫像後人略其傳書于卷尾也豫既拓此畫未暇寫此傳聊爾存于斯跋金樓子後梁元帝金樓子自謂絶筆之製余久欲見之及觀其書但裒萃傳記殊無襟臆語恐所著諸書類若是然以帝子之尊不嗜聲色而沈酣文史纂述殆二百卷勤博至斯自可賞慕至于忿狷忌前揚伉儷之惡尋閼伯之兵以至守株延敵自忘其國深可嗟慨長睿父書跋逸少升平帖後晉史稱王逸少書暮年方妙此帖升平二年書詎其終才三載正暮年迹也故結字比樂毅告誓諸帖尤古質殊類鍾元常渾渾然有篆籀意非遇真賞未易遽識也長睿父題跋陳文惠公記烏君事後人之致力不勝天力之為功不若命今昔所同知也故耆艾夭折豐泰厄窮運于冥冥契于昭昭其數之滋其時之會人之始生固已存矣所謂天命者不大示其兆不顯著其符莽渺昏默實難稽揆豈非俾人懋德勤行競時赴功兢業惕勵以自克耶不然則善將惰惡將肆人事將措而不修矣天之于人意殆以此今以陳文惠公與烏君窮逹之事觀之信乎有時數也竊惟仁宗皇帝御天下四十二年考愼輔相類得賢傑以啓治功文惠公其人矣迹其興韋布位鼎司植志持身蓄德惇義蓋非恃命之自爾者則日者之言雖可諶公之為善亦不怠天人力命相須以行此其遺風所以想見于後世也故待烏君之禮足以厚交朋初終之契傳烏君之書足以抑時人詭躁之求論是文則淳深雅淡可以聞其言而知其德觀是筆則端莊遒婉可以見其迹而推其心余雖不逮覿公之容承公之音即是論之亦可知公之志矣于是乎書跋楊夷甫提刑等帖後川本無此册以親友相聞帖紙綴屬才十簡八人耳適偶尋繹而三人已為鬼録撫卷慨然謂李富國宗儒范之彥邦直楊逹夷甫楊最好事此其書也長水紙為物至微而易得楊欲得再三言之豈索于愛者也夷甫學雖未至然亦喜事佳子弟奉使巴夔遂沒不返觀此書已為陳迹矣挍正崇文總目十七條高氏小史名峻一作崚山海經侍中秀領挍秀即劉歆也丹元子步天歌此但記列星所在并其象數使人易識耳非占説也黃庭經此特梁丘子注爾張萬福唐人有傳總目云不詳何代人步虛洞章總目云不詳何代人修靜東晉道士隱廬山葛仙公序葛洪此恐是葛玄元綱論此前已有所謂真綱論即此蓋避聖祖名三茅君內傳云唐李遵撰遵非唐人德山集德山不詳何人德山在朗州蓋宣鑒禪師乃唐僖宗朝人此云不知何人疏謬如此破胡集後云釋氏興于西域自漢末始流于中國非漢末文選按李善注在五臣之前此云因五臣而自為注非是中書省試題詠詩若集中純載詩即不可謂之詩筆丹陽集己見總集此重出酈炎集當在前蔡融來朋皆唐人見丹陽集質論李後主與徐鉉書云為爾於質論前作得一小序子即此論也論漢晉碑與董彥遠同觀文翁學生題名豫謂董云結體殊不類隸董云集古録以為文翁學生豫云嘗考此碑其郡望有云江陽寧蜀遂寧晉原以晉書志考之江陽蜀置此郡寧蜀遂寧晉原皆是宣武平蜀後置彥遠擊節此言以為辨正精詳又問豫云周公禮殿記云甲午年故府梓潼文君不審文君之名豫云華陽國志載文參字子竒梓潼人平帝用為益州太守記中文君乃此人也甲午乃光武建武十年云且如漢成臯令任碑云字伯嗣名已缺任延熹中守官按漢桓紀延熹八年桂陽太守任胤乃此人故其字伯嗣豫又云備員祕館絫年御府降出太清樓竒書異傳甚富令參挍得失豫喜觀未見書同舍出省後豫嘗侵晚而歸董云異書不可不看逌初除正字供職未幾乃以平日所疑故事因閲傳記決疑者多自此後論議覺進信知書不負人也所恨未嘗獲覩太清樓書豫又論集古録有疏脫處如跋漢倉頡廟碑云此碑有蓮勺左鄉有秩池陽左鄉有秩池陽集丞有秩皆不知是何名號豫按前漢書張厰以鄉有秩補太守卒史後漢百官志鄉置有秩三老遊徼本注曰有秩郡所署秩百石掌一鄉人注引漢官儀載戶五千則置有秩風俗通云有秩則田間大夫言其官裁有秩爾蓋鄉吏之名號也又論水經與漢碑刻不同者多如王純碑道元注云王紛碑又州輔碑道元注云州苞如袁良碑道元注云袁梁又如屬國都尉王君碑道元注云蜀都太守姓王字子雅彥遠云恐忘記遂盡録去論靈臺碑集古録靈臺碑以為史記地志水經諸書皆無堯母葬處豫按漢章帝紀注述征記云成陽縣東南有堯母慶都墓上有祠廟又按水經注今成陽城西二里有堯陵陵南一里有堯母慶都陵于城為西南稱曰靈臺而此碑云堯母葬于兹欲人不知名曰靈臺以二事證之堯與堯母葬處明白若此集古又云俗本多作城陽獨此碑為成陽當以碑為正豫考成陽與城陽自别成陽縣屬濟隂城陽乃漢齊悼惠王之子章所封之國名帝堯碑云慶都與赤龍交生伊堯其事神異不可測集古又云廷尉某姓名摩滅豫按漢廷尉仲定碑云遷廷尉卿託病乞歸修堯靈臺黃屋三十餘而靈臺碑中有云濟隂太守成陽令各遣大掾輔助仲君故知仲定無疑大凡考挍往古事迹先須孰讀強記遇事加之精審決無疏略歐陽公集古其文章冠世後人豈可跂及然大要在考校而非所長是可歎也川本自大凡至歎也無此五十四字論玉輅建太常用黃色謹按春官巾車王之五路玉路建大常金路建大旗象路建大赤革路建大白木路建大麾而司常九旗之名物日月為常交龍為旗熊虎為旗鳥隼為旟龜蛇為旐今以五路所建儷之太常大旗已著其名考其餘者大赤蓋旟也大白蓋旗也大麾蓋旐也何以知之以所飾之物辨而知之龍位東故旗之色宜青鳥隼位南故旟之色當赤熊虎位西故旗之色當白龜蛇位北故旐之色當黑由鳥隼熊虎觀之則知大赤大白之為旟與旗也蓋巾車或謂之太常大旗者以旗之名言之或謂之大赤大白者以物之色言之皆互相見也于玉路言常金路言旗則象為旐可知矣於象路言大赤革路言大白則玉路所建之常為黃金路所建之旗為青木路所建之旐為黑可知矣而先儒乃謂大赤為通帛之旃以大白為用商之色大麾不在九旗之數而以九旗之帛皆用絳悉非也至于後世玉路以青為飾金路以赤革路以黃象路以白皆無經據失之遠矣獨木路用北方之色偶合經旨焉然日月為常日月麗乎天天玄而地黃則太常之色黃其可乎曰日月所麗則天而所出則地車者王之待以載也車之所建為出地之象不亦可乎又王之衮冕玄衣纁裳其衣玄者天之色而衣之章有山焉山麗于地矣今繢山于色玄之衣亦無害于義則飾日月于色黃之太常復何疑哉蓋巾車諸路之序金象革木相次則青赤白黑四方之色各以其序而具矣由是觀之則太常之也非黃而何挍定楚詞序漢書朱買臣傳云嚴助薦買臣召見説春秋言楚詞帝甚恱之王褒傳云宣帝修武帝故事徵能為楚詞者九江被公等楚詞雖肇于楚而其目蓋始于漢世然屈宋之文與後世依放者通有此目而陳説之以為惟屈原所著則謂之離騷後人效而繼之則曰楚詞非也自漢以還文師詞宗慕其軌躅摛華競秀而識其體要者亦寡蓋屈宋諸騷皆書楚語作楚聲紀楚地名楚物故可謂之楚詞若些只羌誶蹇紛侘傺者楚語也頓挫悲壯或韻或否者楚聲也沅湘江澧修門夏首者楚地也蘭茝荃藥蕙若蘋蘅者楚物也他皆率若此故以楚名之自漢以還去古未遠猶有先賢風槩而近世文士但賦其體韻其語言雜燕粵事兼夷夏而亦謂之楚詞失其指矣此書既古簡册迭傳亥豕帝虎舛午甚多近世朝監美叔獨好此書乃以春明宋氏趙郡蘇氏本參挍失得其子伯以叔豫又以廣平宋氏及唐本與太史公記諸書是正而某亦以先唐舊本及西都留監博士楊建勳及洛下諸人所藏及武林吳郡槧本讐挍始得完善文有殊同者皆兩出之按此書舊十有六篇并王逸九思為十七而某所見舊本乃有揚雄反騷一篇在九歎之後此文亦見雄本傳與九思共十有八篇而王逸諸序並載于書末猶古文尚書漢本法言及史記自序漢書敘傳之體駢列于卷尾不冠于篇首也今放此録之又太史公屈原列傳班固離騷傳序論次靈均之事為詳故編于王序右方陳説之本以劉協辨騷在序之前論世不倫故緒而正之而天問之章詞嚴義密最為難誦柳柳州于千祀後獨能作天對以應之深𢎞傑異析理精博而近世文家亦難遽曉故分章辨事以其所對别附于問庶幾覽者瑩然知子厚之文不茍為艱深也自屈原傳而下至陳説之序又附以今序别為一卷附十通之末而目以翼騷云至于屈原行之忠狷文之正變事之當否固昔賢之所詳僕可得而略之也政和初元七月初吉武陽黃某長睿父序校定焦贛易林序承議郎行祕書省挍書郎臣黃某所挍讐中焦延壽易林定著十六篇篇中或字誤以快為決以羊為年如此者衆校讐已定又若喜或為嘉鸛或為鵲義可兩存皆並著可繕寫川本無六字今存之焦延壽者字贛梁人以好學得幸梁王王共其資用令極意學學成為郡吏察舉補令小黃以候伺先知盜盜不得發舉最當遷吏民上書願留詔許增秩卒于小黃其説長于災變以授京房又著易林十六篇其法每卦變而之六十四為林凡三千八百四臣謂延壽之法凡筮得某卦之某卦則觀其所之卦林以占吉凶或卦爻不發則但觀本卦林詞初未嘗分四時節候至于漢書京房傳所謂六十四卦更直日用事者蓋爻主一日六十卦當三百六十日餘四卦為監司此法但以風雨寒溫為候而占災變耳若房封事所謂辛酉太陽精明丙戌蒙氣復起之類孟康注之甚詳此自延壽占災祥之一法非關易筮也後世昧者弗悟乃合二術而一之而于直日卦中求所得卦以考人之吉凶謬託燕薊士之祕法豈不誤甚歟蓋直日之法分至外餘日惟一爻用事而易林變卦則非止一爻也乃知林自林直日災祥之法自直日災祥之法二者雖皆本于易同出于焦贛而初未嘗一其用也又本朝有王佖者於雍熙二年春遇異人為筮得觀之賁其林有西去華山遊子為患之語乃贛易觀中賁林也若以直日之法用之觀及賁非白露之卦非春所宜用不當以觀中求之然其後事應甚著異人之占固不應誤是知直日之説非可用于筮占也章章矣後之觀者不可以不辨延壽所著雖卜筮之書出于隂陽家流然當西漢中葉去三代未遠文辭淡雅頗有可觀謹苐録上校定師春書序承議郎行祕書省校書郎臣黃某所校讐中師春五篇以相挍除復重定著三篇篇中或誤以夢為瞢以放為依如此類者衆頗揃皆已定可繕寫案晉太康二年汲郡民不準盜發魏襄王冡得古竹書凡七十五篇晉征南將軍杜預云别有一卷純集左氏傳卜筮事上下次第及其文義皆與左傳同名曰師春師春似是鈔集人名也今觀中祕所藏師春乃與預説全異預云純集卜筮事而此乃記諸國世次及十二公嵗星所在并律呂諡法等末乃書易象變卦又非專載左氏傳卜筮事繇是知此非預所見師春之全也然預記汲冡他書中有易隂陽説而無彖繫又有紀年三代并晉魏事疑今師春蓋後人雜鈔紀年篇耳然預云紀年起自夏商周而此唐虞以降皆録之預云紀年皆三代王事無諸國别而此皆有諸國預云紀年特記晉國起殤叔次文侯昭侯而此記晉國世次自唐叔始是三者又與紀年異矣及觀其紀嵗星事有杜征南洞曉隂陽之語繇是知此書亦西晉人集録而未必盡出汲冡也然臣近考辨祕閣古寶器有宋公䜌餗鼎稽之此書䜌乃宋景公名與鼎銘合而太史公記及他書皆弗同繇是知此書尚多古事可備考證固不可廢云謹苐録上東觀餘論卷下
